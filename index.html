<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-pal="ocean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#F3F6FA;--sf:#fff;--ink:#0E1A2B;--mut:#5B6B80;--ln:#DCE3EC;--cb:#0E1A2B;--gl:rgba(14,26,43,.045);--n0:#1F6FD6;--s0:#D9392F;--v0:#6D4AE0;--m0:#0B8F80;--net:var(--n0);--sec:var(--s0);--vrt:var(--v0);--mob:var(--m0)}
[data-theme=dark]{--bg:#0A111D;--sf:#111B2C;--ink:#E8EEF6;--mut:#93A3B8;--ln:#22314A;--cb:#060B14;--gl:rgba(255,255,255,.04);--net:color-mix(in srgb,var(--n0) 58%,#fff);--sec:color-mix(in srgb,var(--s0) 58%,#fff);--vrt:color-mix(in srgb,var(--v0) 58%,#fff);--mob:color-mix(in srgb,var(--m0) 58%,#fff)}
[data-pal=sunset]{--n0:#C2410C;--s0:#BE123C;--v0:#86198F;--m0:#A16207}
[data-pal=forest]{--n0:#15803D;--s0:#B91C1C;--v0:#0369A1;--m0:#A16207}
[data-pal=neon]{--n0:#0891B2;--s0:#C026D3;--v0:#4F46E5;--m0:#059669}
[data-pal=rose]{--n0:#BE185D;--s0:#9333EA;--v0:#2563EB;--m0:#0F766E}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 16px/1.7 Inter,Cairo,system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--net) 22%,transparent),transparent),radial-gradient(700px 360px at 0% 10%,color-mix(in srgb,var(--vrt) 18%,transparent),transparent),linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:auto,auto,36px 36px,36px 36px;background-attachment:fixed}
[lang=ar] body{font-family:Cairo,Inter,system-ui,sans-serif;line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--net);outline-offset:2px}
.c-net{--c:var(--net)}.c-sec{--c:var(--sec)}.c-vrt{--c:var(--vrt)}.c-mob{--c:var(--mob)}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-block-end:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{border:0;padding:0;background:linear-gradient(90deg,var(--net),var(--vrt),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;font-size:20px;margin-inline-end:auto}
.hr{display:flex;align-items:center;gap:12px}
.pals{display:flex;gap:6px}
.pd{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--sf);background:var(--g);box-shadow:0 0 0 1px var(--ln)}
.pd[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--sf)}
.lang button{border:0;background:none;padding:5px 14px;font-weight:800;font-size:14px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.th{border:1px solid var(--ln);background:var(--sf);border-radius:50%;width:36px;height:36px}
main{padding-block:28px 40px;min-height:70vh}
main>*{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(30px,5vw,52px);line-height:1.15;margin:0 0 16px;letter-spacing:-.02em}
[lang=ar] h1{letter-spacing:0;line-height:1.4}
.ttl{margin:0 0 6px;font-size:24px}.sub{color:var(--mut);margin:0 0 22px;max-width:70ch}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:16px 44px}
.hero p{color:var(--mut);max-width:48ch;margin:0 0 8px}
.term{background:var(--cb);color:#9EE6A0;font:400 14px/1.6 'JetBrains Mono',ui-monospace,monospace;padding:18px 20px;border-radius:12px;direction:ltr;text-align:left;min-height:4.6em;border:1px solid var(--ln);box-shadow:0 0 28px color-mix(in srgb,var(--mob) 28%,transparent)}
.term i{display:inline-block;width:8px;height:1em;background:#9EE6A0;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.cred{display:inline-block;margin-block-start:14px;font-size:13px;font-weight:600;color:var(--mut);border:1px dashed var(--ln);border-radius:999px;padding:4px 14px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ccard{text-align:start;display:flex;flex-direction:column;gap:6px;background:var(--sf);border:1px solid var(--ln);border-block-start:5px solid var(--c);border-radius:14px;padding:20px;transition:.2s}
.ccard .code,.chead .code{font:800 13px 'JetBrains Mono',ui-monospace,monospace;color:var(--c)}
.ccard b{font-size:18px;line-height:1.4}.ccard small{color:var(--mut);font-size:14px;line-height:1.6}
.ccard .meta{margin-block-start:auto;padding-block-start:10px;font-size:13px;font-weight:600;color:var(--mut)}
.ccard:hover,.card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block-end:8px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.chead{margin-block:18px 4px}.chead h2{margin:2px 0 6px;font-size:28px;line-height:1.3}.chead p{margin:0;color:var(--mut)}
.secs{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px;overflow-x:auto;width:fit-content;max-width:100%;margin-block:14px 28px}
.secs button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.secs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.mod{display:grid;grid-template-columns:1fr 2fr;gap:32px;padding-block:32px;border-block-start:1px solid var(--ln)}
.mod:first-child{border:0;padding-block-start:0}
.mod h2{margin:0 0 8px;font-size:24px;line-height:1.3;color:var(--c)}.mod p{margin:0;color:var(--mut)}
dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
dl div{border-inline-start:3px solid var(--c);padding-inline-start:14px}
dt{font-weight:800}dd{margin:2px 0 0;color:var(--mut);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-block-start:16px}
.card{text-align:start;background:var(--sf);border:1px solid var(--ln);border-block-start:4px solid var(--c);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:170px;transition:.2s}
.tag{font-size:13px;font-weight:800;color:var(--c)}
.card h3{margin:0;font-size:17px;line-height:1.5}
.card em{margin-block-start:auto;font-style:normal;font-size:14px;color:var(--mut)}
dialog{border:0;padding:0;border-radius:16px;width:min(760px,94vw);max-height:90vh;background:var(--sf);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(6,11,20,.65)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-block-end:1px solid var(--ln);position:sticky;top:0;background:var(--sf)}
.x{border:1px solid var(--ln);background:none;border-radius:8px;padding:4px 14px;font-weight:600}
.mb{padding:8px 24px 24px}
h4{margin:18px 0 6px;font-size:13px;color:var(--c)}
.mb p,.eb p{margin:0}
pre{direction:ltr;text-align:left;background:var(--cb);color:#E8EEF6;border-radius:10px;padding:16px;overflow-x:auto;margin:0;font:400 13.5px/1.7 'JetBrains Mono',ui-monospace,monospace}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.88em;background:var(--bg);padding:1px 6px;border-radius:5px}
pre code{background:none;padding:0;font-size:inherit}
.k{color:#FF9EC4}.s{color:#9EE6A0}.n{color:#FFCB6B}.t{color:#7FC8FF}.m{color:#7D8CA3;font-style:italic}
details.ex{background:var(--sf);border:1px solid var(--ln);border-inline-start:6px solid var(--c);border-radius:10px;margin-block-end:10px}
summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';display:inline-block;width:1.4em;color:var(--c);font-weight:800}
details[open]>summary::before{content:'\2013'}
.eb{padding:0 22px 20px}.eb pre{margin-block-start:10px}.eb ul{margin:4px 0 0;padding-inline-start:20px}.eb li{margin-block-end:4px}
.plain{margin-block-start:12px!important;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.lvh{margin:32px 0 12px;font-size:20px;color:var(--c,var(--ink))}.lvh:first-child{margin-block-start:0}
.try{margin:16px 0 4px;padding:14px;border:1px dashed var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 6%,transparent)}
.try h4{margin:0 0 8px}
.try textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:10px;font:400 13.5px/1.6 'JetBrains Mono',ui-monospace,monospace}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:8px 18px;font-weight:600;margin-inline-end:8px}
.res{margin-block-start:12px;border-radius:10px}
.res.ok,.res.part,.res.bad{padding:10px 14px;border-inline-start:5px solid var(--rc)}
.res.ok{--rc:#22A06B;background:color-mix(in srgb,#22A06B 13%,transparent);animation:pop .3s}
.res.part{--rc:#E8A33D;background:color-mix(in srgb,#E8A33D 13%,transparent)}
.res.bad{--rc:#D9392F;background:color-mix(in srgb,#D9392F 13%,transparent)}
.res p{margin:0}.res ul{list-style:none;margin:8px 0 0;padding:0}.res li{padding:3px 0;font-size:15px}
.res li.ok b{color:#22A06B}.res li.no b{color:#D9392F}
.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 8px;display:grid;gap:14px}
.steps>li{counter-increment:s;position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px 20px;padding-inline-start:72px}
.steps>li::before{content:counter(s);position:absolute;inset-inline-start:20px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
.steps b{display:block;font-size:18px}.steps p{margin:4px 0 0;color:var(--mut)}.steps pre{margin-block-start:10px}
.stages,.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stage,.tool,.ck{background:var(--sf);border:1px solid var(--ln);border-radius:12px}
.stage{border-block-start:4px solid var(--c);padding:18px}
.stage .no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:800}
.stage h3{margin:8px 0 0;font-size:20px}.stage em{display:block;color:var(--mut);font-style:normal;margin-block-end:8px}
.stage ul{margin:0;padding-inline-start:18px}.stage li{margin-block-end:4px;font-size:15px}
.ckl{display:grid;gap:8px}.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;cursor:pointer;border-radius:10px}
.ck input{margin-top:7px;accent-color:var(--net)}
.tools{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.tool{padding:12px 14px}.tool b{display:block}.tool span{color:var(--mut);font-size:14px}
.fact{background:linear-gradient(135deg,color-mix(in srgb,var(--vrt) 24%,var(--sf)),color-mix(in srgb,var(--net) 20%,var(--sf)));border:1px solid var(--ln);border-radius:16px;padding:24px 26px;margin-block-end:8px}
.fact p{font-size:20px;line-height:1.6;margin:8px 0 16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:8px 16px;font-weight:600}
.opt.ok{background:#22A06B;border-color:#22A06B;color:#fff}.opt.no{background:#D9392F;border-color:#D9392F;color:#fff}
.qz{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px 20px;margin-block-end:10px}.qz p{margin:0 0 10px}.qz .zr{color:var(--mut);margin:10px 0 0}
footer{color:var(--mut);font-size:14px;border-block-start:1px solid var(--ln);padding-block:20px}
footer b{display:block;margin-block-start:6px;color:var(--ink)}
.secs .sep{width:1px;background:var(--ln);margin-inline:6px;flex:none}
.dm{margin-block-end:34px}.dm h3{margin:0 0 12px;font-size:20px;color:var(--c)}
.dmrow{display:grid;grid-template-columns:minmax(220px,260px) 1fr;gap:24px;align-items:start}
.phone{border:2px solid var(--ln);border-radius:28px;background:var(--sf);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:260px}
.pbar{background:var(--c);color:#fff;padding:12px 16px;font-weight:700}
.pbody{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:260px;justify-content:center}
.pt{font-weight:600}
.dice{width:96px;height:96px;background:#fff;border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.dice i{border-radius:50%}.dice i.on{background:#0E1A2B}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.mini-steps{margin:0 0 14px;padding-inline-start:20px}.mini-steps li{margin-block-end:6px}
.tree,.tree ul{list-style:none;margin:0;padding-inline-start:22px;border-inline-start:2px solid var(--ln)}
.tree{border:0;padding:0}.tree li{margin-block:6px}
.tree li>span{display:inline-block;background:var(--sf);border:1px solid var(--c);border-radius:8px;padding:3px 12px;font-size:14px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.mini{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:200px;justify-content:center;text-align:center}
.mini small{color:var(--mut);font-weight:600}
.av{width:60px;height:60px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:26px}.av.s{width:40px;height:40px;font-size:18px}
.mini.rw{flex-direction:row;flex-wrap:wrap;gap:14px}.mini.rw>div{display:flex;flex-direction:column;align-items:center}.mini.rw span{font-size:24px}.mini .cap{width:100%}
.fld{display:block;width:100%;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;font-size:14px;color:var(--mut);background:var(--bg)}
.btn{display:block;width:100%;background:var(--c);color:#fff;border-radius:8px;padding:7px;font-weight:700;font-size:14px}
.err{color:#E5484D;font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.fl{flex:1 1 140px;background:var(--sf);border:1px solid var(--ln);border-block-start:4px solid var(--c);border-radius:10px;padding:10px 12px}.fl b{display:block}.fl span{color:var(--mut);font-size:14px}
.arw{align-self:center;font-style:normal;color:var(--mut)}[dir=rtl] .arw{transform:scaleX(-1)}
.tw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--ln)}
.tb th{background:color-mix(in srgb,var(--c) 18%,var(--sf));text-align:start;padding:10px 12px}.tb td{padding:10px 12px;border-block-start:1px solid var(--ln);vertical-align:top}
.tb td:first-child{font-weight:600}.tb a{color:var(--net)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-block-end:12px}.kv>div{background:var(--sf);border:1px solid var(--ln);border-inline-start:4px solid var(--c);border-radius:10px;padding:10px 14px}.kv b{display:block;color:var(--c);font-size:13px}
.dkrow{display:flex;flex-wrap:wrap;gap:12px;margin-block-end:12px}.dkrow label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.dkrow input,.dkrow select{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit;min-width:160px}
.li{display:flex;gap:16px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}.liavatar{width:64px;height:64px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.li p{margin:6px 0}.weak{color:#E5484D}.good{color:#22A06B}.chips2 span{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:2px 12px;margin:2px;font-size:13px}
.tick{list-style:none;margin:0;padding:0}.tick li::before{content:'\2610 '}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.person{display:flex;gap:16px;background:var(--sf);border:1px solid var(--ln);border-block-start:4px solid var(--c);border-radius:14px;padding:18px;margin-block-end:12px}
.person h3{margin:0;font-size:20px}.person p{margin:4px 0}.role{color:var(--c);font-weight:700;font-size:14px}.small{color:var(--mut);font-size:14px}
.av2{width:56px;height:56px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.person textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;font-size:14px}
.person>div:last-child{flex:1;min-width:0}.person a{color:var(--net)}
.today{background:color-mix(in srgb,var(--c,var(--net)) 25%,transparent);border-radius:6px;padding:2px 6px;font-weight:700}
@media(max-width:760px){.dmrow{grid-template-columns:1fr}}
@media(max-width:760px){.hero,.mod{grid-template-columns:1fr}dl{grid-template-columns:1fr}.hr{width:100%;justify-content:space-between}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a.go{display:inline-block;text-decoration:none}.lnk{margin-inline-end:8px}
.hl{color:var(--mut);font-style:italic;font-size:14px}
.lilink{display:inline-flex;align-items:center;gap:8px;color:var(--net);font-weight:600;text-decoration:none;border:1px solid var(--ln);border-radius:8px;padding:6px 12px}.lilink b{background:#0A66C2;color:#fff;border-radius:4px;padding:0 5px;font-size:13px}
.person ul{margin:6px 0;padding-inline-start:18px}.person li{margin-block-end:4px;font-size:15px}
.dp iframe{width:100%;height:520px;border:1px solid var(--ln);border-radius:12px;margin-block:12px;background:#fff}
textarea.code{width:100%;background:var(--cb);color:#E8EEF6;border:1px solid var(--ln);border-radius:10px;padding:14px;font:400 13.5px/1.7 'JetBrains Mono',ui-monospace,monospace;margin-block:10px}
.bar2{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin-block:8px}.bar2 i{display:block;height:100%;transition:width .2s}
.s0{background:#E5484D}.s1{background:#F2994A}.s2{background:#E8A33D}.s3{background:#7BC96F}.s4{background:#22A06B}
code.wrap{white-space:pre-wrap;word-break:break-all}
.gq{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font:inherit;margin-block-end:12px}
.gls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.gl{background:var(--sf);border:1px solid var(--ln);border-inline-start:4px solid var(--c);border-radius:10px;padding:10px 14px}.gl b{display:block;color:var(--c)}.gl span{font-size:15px;color:var(--mut)}
.pomo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 20px;width:fit-content;max-width:100%}.pomo b{font:800 40px 'JetBrains Mono',ui-monospace,monospace}.pomo span{color:var(--mut);font-weight:600}

const ATT=[
['pe',['Phishing','التصيّد (Phishing)'],['Fake emails, texts or sites that trick you into giving away passwords or clicking a harmful link.','رسائل أو مواقع مزيفة بتضحك عليك عشان تدّي الباسورد بتاعك أو تدوس على لينك ضار.'],['An SMS says your parcel is stuck and links to a look-alike site that asks for your card.','رسالة SMS بتقول إن شحنتك واقفة ومعاها لينك لموقع شبه الأصلي بيطلب بيانات كارتك.'],['Check the sender and the exact web address, never log in from a link in a message, and turn on multi-factor authentication.','اتأكد من المرسل والعنوان بالظبط، ومتسجلش دخول من لينك جاي في رسالة، وفعّل الـ multi-factor authentication.']],
['pe',['Social engineering','الهندسة الاجتماعية'],['Manipulating people instead of machines, using trust, urgency or fear.','التلاعب بالناس مش بالأجهزة، باستخدام الثقة أو الاستعجال أو الخوف.'],['A caller says they are IT support and asks for your password to fix an urgent problem.','حد بيتصل ويقول إنه من الـ IT support وعايز الباسورد بتاعك عشان يحل مشكلة مستعجلة.'],['Verify the person through another channel, and remember that no real support team needs your password.','اتأكد من الشخص من قناة تانية، وافتكر إن مفيش support حقيقي بيحتاج الباسورد بتاعك.']],
['ne',['DDoS','هجوم DDoS'],['Floods a server with so much traffic that real users cannot get through.','بيغرّق السيرفر بترافيك كتير لدرجة إن المستخدمين الحقيقيين مش بيعرفوا يدخلوا.'],['Thousands of hacked cameras (a botnet) all request the same website at once.','آلاف الكاميرات المخترقة (botnet) كلها بتطلب نفس الموقع في نفس الوقت.'],['Rate limiting, a CDN or traffic-scrubbing service, firewalls, and capacity that can scale.','تحديد معدل الطلبات، وCDN أو خدمة تنقية ترافيك، وfirewalls، وقدرة تتوسع وقت الزحمة.']],
['ne',['Man-in-the-middle','هجوم الوسيط (MITM)'],['An attacker secretly sits between two parties to read or change their traffic.','مهاجم بيقعد في النص بين طرفين من غير ما يحسوا عشان يقرا أو يغيّر الترافيك.'],['A fake free Wi-Fi hotspot in a café that quietly records unencrypted traffic.','نقطة واي فاي مجانية مزيفة في كافيه بتسجّل أي ترافيك مش متشفّر.'],['Use HTTPS/TLS, avoid public Wi-Fi or secure it with a VPN, and never ignore certificate warnings.','استخدم HTTPS/TLS، وتجنّب الواي فاي العام أو أمّنه بـ VPN، ومتتجاهلش تحذيرات الشهادات.']],
['we',['SQL injection','حقن SQL (SQL injection)'],['Input is joined into a database query, so the attacker can change what the query does.','الـ input بيتدمج جوه query الداتابيز فالمهاجم يقدر يغيّر اللي الـ query بتعمله.'],['Typing `\' OR \'1\'=\'1` into a login form returns every user.','كتابة `\' OR \'1\'=\'1` في فورم اللوجين بترجّع كل اليوزرز.'],['Use parameterised queries, validate input, and give the database account only the rights it needs.','استخدم parameterised queries، وراجع الـ input، وادّي حساب الداتابيز الصلاحيات اللي محتاجها بس.'],['Lecture 1 asks "Is the input valid?" on every login screen: this is why.','المحاضرة 1 بتسأل "هل الـ input سليم؟" في أي شاشة لوجين: وده السبب.']],
['we',['Cross-site scripting (XSS)','XSS'],['A malicious script is injected into a page and then runs in other visitors\' browsers.','سكريبت ضار بيتحقن في صفحة وبعدين بيشتغل في متصفحات الزوار التانيين.'],['A comment containing a script tag steals the cookies of everyone who views it.','تعليق فيه script tag بيسرق الكوكيز بتاعة كل واحد بيفتح الصفحة.'],['Escape or encode everything shown on a page, validate input, and use a Content-Security-Policy.','اعمل escape لأي حاجة بتتعرض في الصفحة، وراجع الـ input، واستخدم Content-Security-Policy.']],
['da',['Ransomware','فيروس الفدية (Ransomware)'],['Malware that encrypts your files and demands payment for the key.','برنامج ضار بيشفّر ملفاتك وبيطلب فلوس مقابل المفتاح.'],['A malicious attachment locks a company\'s files and leaves a payment note.','مرفق ضار بيقفل ملفات شركة ويسيب رسالة بطلب الدفع.'],['Keep offline backups, install updates, do not open unknown attachments, and limit user rights.','احتفظ بنسخ احتياطية أوفلاين، ونزّل التحديثات، ومتفتحش مرفقات مجهولة، وقلّل صلاحيات المستخدمين.']],
['da',['Brute force & credential stuffing','التخمين وإعادة استخدام الباسوردات'],['Trying huge numbers of passwords, or reusing passwords leaked from other sites.','تجربة أعداد ضخمة من الباسوردات، أو استخدام باسوردات اتسربت من مواقع تانية.'],['A script tries thousands of leaked email and password pairs on a login page.','سكريبت بيجرّب آلاف الأزواج المسرّبة من إيميل وباسورد على صفحة لوجين.'],['Limit login attempts, require multi-factor authentication, use unique strong passwords, and hash with a slow algorithm.','حدّد عدد محاولات الدخول، واطلب multi-factor authentication، واستخدم باسوردات قوية مختلفة، واعمل hash بخوارزمية بطيئة.'],['Think of the Cyber Login screen from class: login needs more than a button.','افتكر شاشة Cyber Login من الكلاس: اللوجين محتاج أكتر من زرار.']],
['da',['Zero-day exploit','ثغرة Zero-day'],['An attack on a flaw the vendor does not know about yet, so no patch exists.','هجوم على ثغرة الشركة المصنّعة لسه معرفتهاش، فمفيش patch ليها.'],['Malware spreads through an unknown bug in a popular browser before a fix is released.','برنامج ضار بينتشر من bug مجهول في متصفح مشهور قبل ما يطلع إصلاح.'],['Layer your defences, update quickly, monitor for strange behaviour, and give each program the least access it needs.','اعمل طبقات حماية، وحدّث بسرعة، وراقب أي سلوك غريب، وادّي كل برنامج أقل صلاحية محتاجها.']]];

const SUMS={
cn:[
{t:['Lecture 1 · Flutter basics','المحاضرة 1 · أساسيات Flutter'],i:[
['What is a mobile app?','يعني إيه تطبيق موبايل؟','An app helps a user finish a task on a phone|Think goal, then input, then output|It may store or send data','التطبيق بيساعد المستخدم يخلّص مهمة على الموبايل|فكّر في الهدف وبعدين المدخلات وبعدين المخرجات|ممكن يخزّن داتا أو يبعتها','Start from what the user wants, not from the code.','ابدأ من اللي المستخدم عايزه، مش من الكود.'],
['Mobile vs desktop vs web','الموبايل والديسكتوب والويب','Phones have sensors, touch and small screens|Battery and network quality matter|Permissions protect privacy and trust','الموبايل فيه حساسات ولمس وشاشة صغيرة|البطارية والنت بيفرقوا|الصلاحيات بتحمي الخصوصية والثقة','Same idea, different environment, so we design differently.','نفس الفكرة بس بيئة مختلفة، فبنصمم بشكل مختلف.'],
['Four ways to build apps','أربع طرق لبناء التطبيقات','Native: separate Android and iOS code, best device access|Web: runs in a browser, easy to update, limited access|Hybrid: a web app wrapped in a mobile shell|Cross-platform: one codebase for many platforms (Flutter)','Native: كود منفصل للأندرويد وللـ iOS ووصول ممتاز للجهاز|Web: بيشتغل في المتصفح وسهل التحديث بس وصوله للجهاز محدود|Hybrid: تطبيق ويب جوه غلاف موبايل|Cross-platform: كود واحد لكذا منصة (Flutter)','Native is one system each. Cross-platform is one code for all.','الـ Native لكل نظام لوحده. والـ Cross-platform كود واحد للكل.'],
['Flutter and Dart','Flutter وDart','Flutter is a UI framework plus tools, not a language|Dart is the language you write in|Dart code becomes widgets, then the engine, then pixels','Flutter إطار عمل للواجهة ومعاه أدوات، مش لغة|Dart هي اللغة اللي بتكتب بيها|كود Dart بيتحول لـ widgets وبعدين الـ engine وبعدين بكسلات','Dart is the recipe, Flutter is the kitchen, widgets are the pieces on screen.','Dart هي الوصفة، وFlutter هو المطبخ والأدوات، والـ widgets هي القطع اللي على الشاشة.'],
['Platforms and setup','المنصات والتثبيت','You can write code on any machine|iOS apps need a Mac with Xcode|Android apps work on Windows, macOS and Linux with Android Studio|Setup: install the SDK, pick an editor, add platform tools, make a virtual device, run flutter doctor, then flutter create and flutter run','تقدر تكتب الكود على أي جهاز|تطبيقات iOS محتاجة Mac فيه Xcode|تطبيقات الأندرويد بتشتغل على ويندوز وماك ولينكس بـ Android Studio|التثبيت: نزّل الـ SDK، واختار editor، وضيف أدوات المنصة، واعمل virtual device، وشغّل flutter doctor، وبعدين flutter create وflutter run','`flutter doctor` tells you exactly what is missing.','أمر `flutter doctor` بيقولك إيه الناقص بالظبط.'],
['Widgets and the widget tree','الـ Widgets وشجرة الـ Widgets','Everything on screen is a widget|Parent widgets hold child widgets, like Lego blocks|Scaffold gives the page frame: an appBar and a body','أي حاجة على الشاشة هي widget|الـ widget الأب بيشيل widgets أولاد، زي مكعبات الليجو|الـ Scaffold بيدّي هيكل الصفحة: appBar وbody','The screen is a tree: big widgets hold smaller ones.','الشاشة شجرة: الـ widgets الكبيرة جواها widgets أصغر.'],
['Layout, buttons and login UI','التخطيط والأزرار وشاشة اللوجين','Center puts one widget in the middle|Column stacks vertically, Row sits side by side|onPressed runs a function when the button is tapped|In a TextField, labelText goes inside InputDecoration','الـ Center بيحط widget واحد في النص|الـ Column بيرصّ فوق بعض والـ Row جنب بعض|الـ onPressed بيشغّل function لما الزرار يتداس|في الـ TextField الـ labelText بتتحط جوه InputDecoration','A login screen is mostly Column, TextField and ElevatedButton.','شاشة اللوجين غالباً Column مع TextField وElevatedButton.'],
['Security thinking','التفكير الأمني','Ask who the user is, whether the input is valid, and whether the action is allowed|Login flow: input, check, decision, access|A button alone is not authentication','اسأل مين المستخدم، وهل الـ input سليم، وهل الأكشن ده مسموح|مسار اللوجين: input ثم check ثم decision ثم access|الزرار لوحده مش authentication','Before building any feature, ask what should be allowed and hidden.','قبل ما تبني أي ميزة اسأل إيه المسموح وإيه اللي يتخبّى.']]},
{t:['Lecture 2 · Dart and Flutter basics','المحاضرة 2 · أساسيات Dart وFlutter'],i:[
['The app we build','التطبيق اللي بنبنيه','Cyber Safety Mini App: AppBar, Show Tip button, SnackBar, Drawer and a score|Every small code change shows a visible result','Cyber Safety Mini App: فيه AppBar وزرار Show Tip وSnackBar وDrawer وسكور|أي تعديل صغير في الكود بتشوف نتيجته على الشاشة','Small app, instant feedback.','تطبيق صغير ونتيجة فورية.'],
['Project map','خريطة المشروع','lib/main.dart is where your app code starts|pubspec.yaml holds assets, fonts and packages|build/ is generated, so never edit it|android/, ios/ and web/ hold platform files','ملف lib/main.dart هو بداية كود تطبيقك|ملف pubspec.yaml فيه الـ assets والخطوط والـ packages|فولدر build/ بيتعمل لوحده فمتعدلش فيه|فولدرات android/ وios/ وweb/ فيها ملفات المنصات','Write your code in lib/ and leave build/ alone.','اكتب كودك في lib/ وسيب build/ في حاله.'],
['How an app starts','التطبيق بيبدأ إزاي','main() runs first, then runApp(), then MyApp, then MaterialApp, then the home screen|runApp tells Flutter which widget is the root','main() بيشتغل الأول وبعدين runApp() وبعدين MyApp وبعدين MaterialApp وبعدين الشاشة الرئيسية|الـ runApp بتقول لـ Flutter مين الـ widget الأساسي','main, runApp, MyApp, MaterialApp, Home.','main ثم runApp ثم MyApp ثم MaterialApp ثم Home.'],
['Classes, properties, values','الـ Classes والـ Properties والـ Values','Widgets are classes|Properties configure them and values fill the properties|Container(width: 200) means class Container, property width, value 200','الـ widgets هي classes|الـ properties بتظبطها والـ values بتملّاها|`Container(width: 200)` يعني class اسمه Container وproperty اسمها width وvalue هي 200','property plus value is the widget configuration.','الـ property مع الـ value هما إعداد الـ widget.'],
['Functions and parameters','الدوال والـ Parameters','A definition writes the function, a call runs it|A parameter is the empty slot, an argument is the real value|Positional parameters depend on order, named ones use labels|required forces a value, and defaults fill in when you skip one','التعريف بيكتب الدالة والنداء بيشغّلها|الـ parameter هو الخانة الفاضية والـ argument هو القيمة الحقيقية|الـ positional بيعتمد على الترتيب والـ named بيستخدم أسماء|الـ required بيجبرك تبعت قيمة والـ default بيشتغل لو مبعتش','Define the recipe first, call it later, send ingredients when needed.','عرّف الوصفة الأول، ونادي عليها بعدين، وابعت المكوّنات وقت الحاجة.'],
['const vs final','const مقابل final','Both can only be set once|const is known before the app runs, like an app title|final is set while the app runs, like the current time or user input','الاتنين بيتحددوا مرة واحدة بس|الـ const معروفة قبل التشغيل زي عنوان التطبيق|الـ final بتتحدد وقت التشغيل زي الوقت الحالي أو اللي المستخدم كتبه','const is known early, final is known at run time.','الـ const معروفة بدري، والـ final معروفة وقت التشغيل.'],
['Stateless vs Stateful','Stateless مقابل Stateful','StatelessWidget never changes by itself|StatefulWidget remembers data that changes, like a score|setState() tells Flutter to run build() again','الـ StatelessWidget مبيتغيرش لوحده|الـ StatefulWidget بيفتكر داتا بتتغير زي السكور|الـ setState() بتقول لـ Flutter يشغّل build() تاني','If the screen must change, you need state.','لو الشاشة لازم تتغير يبقى محتاج state.'],
['SnackBar and Drawer','الـ SnackBar والـ Drawer','SnackBar is a short message at the bottom: ScaffoldMessenger.of(context).showSnackBar(...)|Drawer is a side menu with a ListView of ListTile items','الـ SnackBar رسالة صغيرة تحت: `ScaffoldMessenger.of(context).showSnackBar(...)`|الـ Drawer قايمة جانبية فيها ListView من عناصر ListTile','SnackBar for quick feedback, Drawer for simple navigation.','SnackBar للتنبيه السريع، وDrawer للتنقل البسيط.']]},
{t:['Lecture 3 · Dice app, assets and state','المحاضرة 3 · Dice app والـ assets والـ state'],i:[
['The plan','الخطة','Build a Dice App where the screen changes when you press Roll|You need an assets folder, Image.asset, state and a random number','هنبني Dice App الشاشة بتتغير فيه لما تدوس Roll|محتاجين فولدر assets وImage.asset وstate ورقم عشوائي','Static UI first, then make it interactive.','الواجهة الثابتة الأول وبعدين نخليها تتفاعل.'],
['Assets and pubspec.yaml','الـ Assets والـ pubspec.yaml','Put images in an assets/ folder|Register them under flutter: assets: in pubspec.yaml|YAML cares about indentation, so keep it exact|The path in code must match the path in pubspec exactly','حط الصور في فولدر assets/|سجّلها تحت `flutter: assets:` في pubspec.yaml|الـ YAML حساس للمسافات فخليها مظبوطة|المسار في الكود لازم يطابق المسار في الـ pubspec بالظبط','Most image errors are a typo or bad indentation.','أغلب مشاكل الصور غلطة كتابة أو مسافات غلط.'],
['Debug checklist','تشيك ليست الأخطاء','Read the console message, for example Unable to load asset|File names are case-sensitive (Dice1.PNG is not dice1.png)|Check pubspec indentation, run flutter pub get, then Hot Restart','اقرا رسالة الكونسول مثلاً Unable to load asset|أسماء الملفات حساسة لحالة الحروف (Dice1.PNG مش dice1.png)|راجع مسافات pubspec وشغّل flutter pub get وبعدين Hot Restart','Stay calm and change one thing at a time.','خليك هادي وغيّر حاجة واحدة كل مرة.'],
['Gradients','التدرج اللوني','LinearGradient blends colours in a direction|Use it inside a Container decoration for the background','الـ LinearGradient بيمزج الألوان في اتجاه|استخدمه في decoration بتاع Container للخلفية','Colours can have a direction.','الألوان ممكن يبقى ليها اتجاه.'],
['State and rollDice()','الـ State والـ rollDice()','One variable, _face, controls both the image and the text|nextInt(6) gives 0 to 5, so add 1|Change _face inside setState() so the UI rebuilds','متغير واحد وهو _face بيتحكم في الصورة والنص|الـ `nextInt(6)` بتدّي 0 لـ 5 فبنضيف 1|غيّر `_face` جوه `setState()` عشان الواجهة تتبني تاني','One state variable, many outputs.','متغير state واحد وكذا مخرج.'],
['Mini animation','أنيميشن بسيط','ScaleTransition makes the dice feel alive|Set up the controller in initState() and clean up in dispose()','الـ ScaleTransition بيخلي النرد حي|جهّز الـ controller في `initState()` ونضّف في `dispose()`','Animation changes how the image appears, not the dice logic.','الأنيميشن بيغيّر شكل ظهور الصورة، مش منطق النرد.'],
['Other image sources','مصادر صور تانية','Image.network loads from the web and fails without internet|Image.asset works offline|image_picker gets photos from the gallery or camera, so explain why you need permission','الـ Image.network بيحمّل من النت وبيفشل من غير إنترنت|الـ Image.asset بيشتغل أوفلاين|الـ image_picker بيجيب صور من المعرض أو الكاميرا، فوضّح ليه محتاج الإذن','Camera access is sensitive, so respect privacy.','الكاميرا حساسة، فاحترم الخصوصية.']]}],
ms:[
{t:['Lecture 4 · Choosing an approach','المحاضرة 4 · اختيار الأسلوب'],i:[
['Waterfall vs agile: when to use which','Waterfall مقابل agile: امتى تستخدم أنهي','Waterfall is linear and planned up front, with low flexibility and one final delivery|Waterfall fits repeat projects with well-defined requirements, controlled scope, fixed price for fixed deliverables and a fixed timeline|Agile is iterative, plans continuously and releases often|Agile fits new projects with uncertain or changing requirements, flexible scope, payment by hours or effort (time and materials) and flexible duration','الـ Waterfall خطي ومتخطط من الأول، مرونته قليلة وبيسلّم مرة واحدة في الآخر|مناسب للمشاريع المتكررة اللي متطلباتها واضحة، والنطاق متحكم فيه، وسعر ثابت لمخرجات ثابتة، وجدول ثابت|الـ Agile بيتكرر على مراحل وبيخطط باستمرار وبيطلّع إصدارات كتير|مناسب للمشاريع الجديدة اللي متطلباتها مش مؤكدة أو بتتغير، والنطاق مرن، والدفع بالساعات أو المجهود (time and materials)، والمدة مرنة','Known requirements point to waterfall. Changing requirements point to agile.','المتطلبات الواضحة تروح لـ waterfall. والمتطلبات اللي بتتغير تروح لـ agile.']]},
{t:['Lecture 5 · Integration, scope and the WBS','المحاضرة 5 · التكامل والنطاق والـ WBS'],i:[
['Four things every project needs at the start','أربع حاجات أي مشروع محتاجها في البداية','Part 1, integration management: hold the project together with the charter, the plan and change control|Part 2, scope, requirements and the WBS: decide exactly what you will and will not deliver|Part 3, procurement: buy from suppliers, make or buy, contracts, choosing a vendor|Part 4, technical writing: write so your reader understands and acts','الجزء 1، إدارة التكامل: تلمّ المشروع بالـ charter والخطة والتحكم في التغيير|الجزء 2، النطاق والمتطلبات والـ WBS: تقرر بالظبط هتسلّم إيه ومش هتسلّم إيه|الجزء 3، المشتريات: تشتري من موردين، تصنّع ولا تشتري، العقود، اختيار المورد|الجزء 4، الكتابة التقنية: تكتب بحيث القارئ يفهم ويتصرف','Part 1 and 2 are covered in the lecture notes here.','الجزء 1 و2 هما اللي متغطيين في الملاحظات هنا.'],
['Integration management','إدارة التكامل','It is the glue that holds a project together|Project plan development: take the results of all the other planning and put them in one consistent document|Project plan execution: do the work, lead the team, produce the deliverables|Integrated change control: coordinate every change so a change in one place does not break another','هي الغراء اللي بيلزّق المشروع ببعضه|تطوير خطة المشروع: خد نتايج كل التخطيط التاني وحطها في مستند واحد متماسك|تنفيذ الخطة: اعمل الشغل وقُد الفريق وطلّع المخرجات|التحكم المتكامل في التغيير: نسّق كل تغيير عشان تغيير في مكان ميبوّظش مكان تاني','Think of an orchestra conductor: they do not play every instrument but make sure everyone plays together.','فكّر في قائد الأوركسترا: مبيعزفش كل الآلات بس بيخلّي الكل يعزف مع بعض.'],
['The five process groups','مجموعات العمليات الخمسة','Initiating gives the project charter|Planning gives the project management plan|Executing gives deliverables, work performance data and change requests|Monitoring and controlling gives approved changes, the change log and plan updates|Closing gives the final product handed over and lessons learned','الـ Initiating بيطلّع الـ project charter|الـ Planning بيطلّع خطة إدارة المشروع|الـ Executing بيطلّع المخرجات وبيانات أداء الشغل وطلبات التغيير|الـ Monitoring and controlling بيطلّع التغييرات المعتمدة والـ change log وتحديثات الخطة|الـ Closing بيطلّع تسليم المنتج النهائي والدروس المستفادة','Monitoring and controlling runs alongside all the others, from start to finish.','الـ Monitoring and controlling شغال جنب كل الباقي من البداية للنهاية.'],
['The project charter','الـ project charter','A short document that formally recognises that the project exists|It gives direction on the objectives and how the project will be managed|It announces the project to the whole organisation|Key stakeholders sign it to show they agree on the need and the intent|Inputs: statement of work, business case, agreements, environmental factors, organisational assets','وثيقة قصيرة بتعترف رسمياً إن المشروع موجود|بتدّي اتجاه للأهداف وإزاي المشروع هيتدار|بتعلن المشروع للمؤسسة كلها|أصحاب المصلحة الأساسيين بيوقّعوا عشان يبيّنوا إنهم موافقين على الحاجة والنية|المدخلات: statement of work وbusiness case والاتفاقيات والعوامل البيئية وأصول المؤسسة','The charter is the project’s birth certificate.','الـ charter هو شهادة ميلاد المشروع.'],
['A one-page charter: the Campus App','Charter في صفحة: Campus App','Budget EGP 600,000, from 1 February to 30 June|Objective: every student gets their timetable, grades and notices on their phone by the start of next term|Success: 70% of students use it in the first month and fewer than 5 serious bugs are reported|Approach: agile with 2-week sprints, outsource the mobile design, pilot with one faculty first|Roles: sponsor is the Vice-President, PM is the IT manager, team is 4 developers and 1 tester','الميزانية 600,000 جنيه، من 1 فبراير لـ 30 يونيو|الهدف: كل طالب يوصله جدوله ودرجاته وإشعاراته على موبايله قبل بداية الترم الجاي|النجاح: 70% من الطلبة يستخدموه في أول شهر وأقل من 5 bugs خطيرة|الأسلوب: agile بـ sprints أسبوعين، تصميم الموبايل برّه، وتجربة مع كلية واحدة الأول|الأدوار: الراعي نائب الرئيس، ومدير المشروع مدير الـ IT، والفريق 4 مطورين وتستر','Sign-off: the sponsor and the project manager.','التوقيع: الراعي ومدير المشروع.'],
['Planning','التخطيط','The main purpose of planning is to guide execution|Every area (scope, time, cost, risk, quality) has its own part of the plan|The approved plan becomes the baseline, and progress is measured against it|Key outputs: team contract, scope statement, work breakdown structure, schedule, risk list','الغرض الأساسي من التخطيط إنه يوجّه التنفيذ|كل مجال (النطاق والوقت والتكلفة والمخاطر والجودة) ليه جزء في الخطة|الخطة المعتمدة بتبقى الـ baseline وبنقيس التقدم عليها|المخرجات الأساسية: team contract وscope statement وWBS وجدول وقايمة مخاطر','The plan guides everything that follows.','الخطة بتوجّه كل اللي بعدها.'],
['Executing and controlling','التنفيذ والتحكم','Executing: the project manager oversees the tasks, monitors performance and manages changes|Controlling: measure progress towards the objectives, spot where reality differs from the plan, take corrective action|Controlling happens in every phase, from start to finish|Key outputs: status and progress reports','التنفيذ: مدير المشروع بيتابع المهام وبيراقب الأداء وبيدير التغييرات|التحكم: قيس التقدم ناحية الأهداف، واكتشف فين الواقع مختلف عن الخطة، واتخذ إجراء تصحيحي|التحكم بيحصل في كل مرحلة من البداية للنهاية|المخرجات الأساسية: تقارير الحالة والتقدم','Do the work and check it stays on track.','اشتغل وتأكد إنك ماشي صح.'],
['Integrated change control','التحكم المتكامل في التغيير','1 Change request: written down with what, why and who asked|2 Impact analysis: effect on scope, time, cost and quality|3 Decision: approve, reject or postpone, by the right people|4 Update the plan, documents and change log|5 Tell everyone, so the team and stakeholders know','1 طلب التغيير: مكتوب فيه إيه وليه ومين طلب|2 تحليل التأثير: على النطاق والوقت والتكلفة والجودة|3 القرار: موافقة أو رفض أو تأجيل من الناس المناسبة|4 تحديث الخطة والمستندات والـ change log|5 بلّغ الكل عشان الفريق وأصحاب المصلحة يعرفوا','Every change goes through the same door.','أي تغيير بيعدّي من نفس الباب.'],
['Closing: finish properly','الإغلاق: خلّص صح','Acceptance: the customer and stakeholders formally accept the final product|Orderly end: hand over, release the team and archive the project files|Lessons learned: what went well, what would we change, write it down for the next project','القبول: العميل وأصحاب المصلحة يوافقوا رسمياً على المنتج النهائي|نهاية منظمة: سلّم وفرّج الفريق وأرشف ملفات المشروع|الدروس المستفادة: إيه اللي نجح وإيه اللي كنا هنغيّره، واكتبه للمشروع الجاي','Even cancelled projects should be closed to learn from them. Most projects end with a final report and a presentation.','حتى المشاريع الملغية لازم تتقفل عشان نتعلم منها. ومعظم المشاريع بتخلص بتقرير نهائي وبريزنتيشن.'],
['Scope: what is in and what is not','النطاق: إيه جوه وإيه برّه','Product scope is the features of what you deliver, for example the app shows timetable, grades and notices|Project scope is all the work needed to deliver it: design, coding, testing, training, user guide|In scope: timetable, grades, notices, Android and iPhone, Arabic and English|Out of scope: paying fees, chat between students, library booking, tablet version, other universities','نطاق المنتج هو مميزات اللي هتسلّمه، مثلاً التطبيق بيعرض الجدول والدرجات والإشعارات|نطاق المشروع هو كل الشغل المطلوب للتسليم: تصميم وكود واختبار وتدريب ودليل مستخدم|جوه النطاق: الجدول والدرجات والإشعارات وAndroid وiPhone والعربي والإنجليزي|برّه النطاق: دفع المصاريف وشات بين الطلبة وحجز المكتبة ونسخة التابلت والجامعات التانية','Writing down what is OUT leaves no space for assumptions.','كتابة اللي برّه بتمنع الافتراضات.'],
['Requirements','المتطلبات','Functional requirements say what the system does, such as students can see their exam timetable|Non-functional requirements say how well it does it: speed, security, ease of use, languages|A good requirement is testable, for example each screen opens in under 2 seconds on 4G','المتطلبات الوظيفية بتقول النظام بيعمل إيه، زي إن الطلبة يشوفوا جدول الامتحانات|المتطلبات غير الوظيفية بتقول بيعمله كويس قد إيه: السرعة والأمان وسهولة الاستخدام واللغات|المتطلب الكويس قابل للاختبار، مثلاً كل شاشة بتفتح في أقل من ثانيتين على 4G','“Fast” is vague; “under 2 seconds on 4G” is testable.','“Fast” غامضة، لكن “أقل من ثانيتين على 4G” قابلة للاختبار.'],
['MoSCoW prioritisation','ترتيب الأولويات MoSCoW','Must have: without it the product fails, for example log in and see the timetable|Should have: important but there is a workaround, for example exam reminders|Could have: nice to have if time allows, for example dark mode|Won’t have (this time): agreed not in this version, for example paying fees in the app','Must: من غيرها المنتج بيفشل، زي تسجيل الدخول ورؤية الجدول|Should: مهمة بس فيه بديل، زي تذكير الامتحانات|Could: حلوة لو الوقت يسمح، زي الوضع الغامق|Won’t (المرة دي): متفق إنها مش في النسخة دي، زي دفع المصاريف في التطبيق','Not everything is a “must”.','مش كل حاجة “must”.'],
['Assumptions and constraints','الافتراضات والقيود','Assumptions are things we believe are true but have not proved: the university gives us access to the student database, most students have a smartphone, the design agency delivers on time|Constraints are limits we must work within and cannot change: budget EGP 600,000, launch before the new term, follow Egypt’s data-protection law','الافتراضات حاجات بنصدّق إنها صح بس لسه مأثبتناش: الجامعة هتدّينا وصول لقاعدة بيانات الطلبة، ومعظم الطلبة معاهم سمارت فون، ووكالة التصميم هتسلّم في الميعاد|القيود حدود لازم نشتغل جواها ومش بنقدر نغيّرها: ميزانية 600,000 جنيه، والإطلاق قبل الترم الجديد، والالتزام بقانون حماية البيانات المصري','Write both down.','اكتب الاتنين.'],
['The WBS: break it into manageable pieces','الـ WBS: قسّمه لقطع تقدر تديرها','The Campus App splits into five branches: 1 Project management, 2 Requirements, 3 Design, 4 Build, 5 Test and launch|Each branch splits into boxes, such as 4.1 Login, 4.2 Timetable, 4.3 Grades|The 100% rule: the WBS contains ALL the work and nothing else|The lowest boxes are work packages','الـ Campus App بيتقسّم لخمس فروع: 1 إدارة المشروع، 2 المتطلبات، 3 التصميم، 4 البناء، 5 الاختبار والإطلاق|كل فرع بيتقسّم لمربعات زي 4.1 تسجيل الدخول و4.2 الجدول و4.3 الدرجات|قاعدة الـ 100%: الـ WBS فيه كل الشغل ومفيهوش حاجة غيره|أصغر المربعات هي work packages','See the tree in the Examples tab.','شوف الشجرة في تاب الأمثلة.']]}],

eg:[
{t:['Lab 1 · Careers, LinkedIn and TryHackMe','لاب 1 · الوظايف وLinkedIn وTryHackMe'],i:[
['UEL Career Zone','UEL Career Zone','UEL\'s online careers platform for students and alumni|Jobs board, 30-minute 1:1 coaching, 15-minute drop-ins, workshops, mentoring and volunteering|Five steps: log in, complete your profile, book a CV check, save and apply to roles, attend one event this term|The Graduate Success Service helps for up to two years after you finish','منصة UEL للوظائف للطلبة والخريجين|فيها jobs board وكوتشينج 1:1 مدته 30 دقيقة وdrop-ins 15 دقيقة وورش وmentoring وتطوع|خمس خطوات: سجّل دخول وكمّل بروفايلك واحجز CV check واحفظ الوظايف وقدّم وروح event واحد الترم ده|خدمة Graduate Success Service بتساعدك لحد سنتين بعد التخرج','Book a CV check in your first month.','احجز CV check في أول شهر.'],
['A strong LinkedIn profile','بروفايل LinkedIn قوي','A clear, friendly photo and a headline that is more than "Student"|About: 3 to 5 sentences on who you are and what you want|Add experience, 10 to 20 skills and featured links like GitHub or TryHackMe|Post formula: problem, what I did, result, link','صورة واضحة ومحترمة وheadline أكتر من كلمة "Student"|About: من 3 لـ 5 جمل عن إنت مين وعايز إيه|ضيف خبرات و10 لـ 20 مهارة وlinks مميزة زي GitHub أو TryHackMe|معادلة البوست: المشكلة، عملت إيه، النتيجة، لينك','Your profile is an online CV that recruiters can find.','بروفايلك هو الـ CV بتاعك أونلاين والـ recruiters بيدوّروا عليه.'],
['LinkedIn do\'s and don\'ts','اعمل ومتعملش على LinkedIn','Do add a personal note to every connection request and say thank you|Do share what you learn and comment thoughtfully|Do not lie about grades or skills, spam, or send blank requests to strangers|Never share passwords, IDs or confidential work','اعمل: ضيف ملاحظة شخصية لكل طلب إضافة وقول شكراً|اعمل: شارك اللي بتتعلمه وعلّق بشكل محترم|متعملش: متكدبش في الدرجات أو المهارات ومتبعتش سبام أو طلبات فاضية لغرباء|ممنوع تنشر باسوردات أو أرقام هوية أو شغل سري','Stay professional and honest.','خليك محترف وصادق.'],
['TryHackMe','TryHackMe','A browser-based platform where you learn cyber security by doing|Rooms are short lessons, learning paths are sets of rooms (for example Pre Security or Cyber Security 101)|Only practise on the machines it gives you, never on real systems|Add your paths and rooms to your CV and LinkedIn as proof','منصة على المتصفح بتتعلم فيها أمن سيبراني بالتطبيق|الـ Rooms دروس قصيرة والـ learning paths مجموعات rooms (زي Pre Security أو Cyber Security 101)|اتدرّب على الأجهزة اللي هي بتدّيهالك بس، مش على سيستمز حقيقية|ضيف الـ paths والـ rooms في الـ CV وLinkedIn كإثبات','Learn by doing, not only by reading.','اتعلم بالتطبيق مش بالقراية بس.'],
['SMART goals','أهداف SMART','Specific, Measurable, Achievable, Relevant, Time-bound|Example: complete the first module of a beginner TryHackMe path by a set date','Specific وMeasurable وAchievable وRelevant وTime-bound يعني محدد وقابل للقياس وممكن ومناسب وليه ميعاد|مثال: خلّص أول موديول من beginner path في TryHackMe قبل تاريخ محدد','A goal with a date turns into a plan.','الهدف اللي ليه تاريخ بيتحول لخطة.']]},
{t:['Lab 3 · OSINT and digital footprinting','لاب 3 · الـ OSINT والبصمة الرقمية'],i:[
['What is OSINT?','يعني إيه OSINT؟','Open Source Intelligence: info from public sources, collected legally|The cycle: plan, collect, process, analyse, report|Sources: search engines, company sites, DNS and WHOIS, social media, public documents, breach services','Open Source Intelligence: معلومات من مصادر عامة بتتجمع بشكل قانوني|الدورة: خطط، اجمع، عالج، حلل، اكتب تقرير|المصادر: محركات البحث ومواقع الشركات وDNS وWHOIS والسوشيال ميديا والمستندات العامة وخدمات التسريبات','Public does not mean harmless.','عام مش معناه إنه من غير خطر.'],
['Your digital footprint','البصمة الرقمية بتاعتك','Active footprint is what you create: posts, profiles, forms|Passive footprint is collected about you: tags, breaches, tracking logs, file metadata|Small facts combined can help someone guess passwords or impersonate you','البصمة النشطة هي اللي إنت بتعمله: بوستات وبروفايلات وفورمز|البصمة السلبية بتتجمع عنك: تاجات وتسريبات وlogs تتبّع وmetadata الملفات|حقائق صغيرة لما تتجمع ممكن تساعد حد يخمّن باسوردك أو ينتحل شخصيتك','Run OSINT on yourself first.','اعمل OSINT على نفسك الأول.'],
['Ethics, permission and scope','الأخلاقيات والإذن والنطاق','White hat has permission, grey hat has none but claims good intent, black hat wants to cause harm|Golden rule: get written permission from the owner that covers exactly what you plan to do|If you find something sensitive: stop, do not open, copy or use it, and report it','الـ White hat معاه إذن والـ grey hat من غير إذن بس بيقول نيته كويسة والـ black hat عايز يأذي|القاعدة الذهبية: خد إذن مكتوب من المالك يغطي اللي ناوي تعمله بالظبط|لو لقيت حاجة حساسة: وقّف، متفتحهاش ولا تنسخها ولا تستخدمها، وبلّغ عنها','Good intentions do not replace permission.','النية الحلوة مش بديل للإذن.'],
['OSINT tools','أدوات الـ OSINT','Google dorks: site: limits to one website, filetype: limits the file type|HaveIBeenPwned lists breaches for an email and checks passwords with k-anonymity|OSINT Framework is a map of sources by category|Maltego draws a graph of entities (domain, email, person) linked by transforms','Google dorks: الـ `site:` بتحدد موقع واحد والـ `filetype:` بتحدد نوع الملف|HaveIBeenPwned بيعرض التسريبات المرتبطة بإيميل وبيفحص الباسوردات بـ k-anonymity|الـ OSINT Framework خريطة مصادر مقسّمة بالفئات|الـ Maltego بيرسم graph من كيانات (دومين وإيميل وشخص) مرتبطة بـ transforms','Use them only on the lab target.','استخدمها على هدف اللاب بس.']]},
{t:['Lab 4 · A day in the life of cyber roles','لاب 4 · يوم في حياة وظايف الأمن السيبراني'],i:[
['Four cyber security roles','أربع وظايف في الأمن السيبراني','SOC analyst watches alerts and decides what is real or a false alarm|Penetration tester breaks in on purpose, with written permission, so it can be fixed|Incident responder steps in when an attack is real and limits the damage|Cloud security engineer sets cloud systems up safely from the start','الـ SOC analyst بيراقب التنبيهات وبيقرر إيه الحقيقي وإيه الإنذار الكاذب|الـ penetration tester بيخترق قصداً وبإذن مكتوب عشان الثغرة تتصلّح|الـ incident responder بيتدخل لما الهجوم يبقى حقيقي وبيقلّل الضرر|الـ cloud security engineer بيجهّز سيستمز الكلاود بأمان من الأول','Watches, tests, responds, builds.','بيراقب، بيختبر، بيستجيب، بيبني.'],
['A SOC analyst\'s day','يوم محلل الـ SOC','The flow: alert fires, add context, decide, act, record|Tools: SIEM (for example Splunk or Sentinel), EDR, email security tools, a ticketing system|Skills: patience, attention to detail, basic networking and log reading','المسار: التنبيه يظهر، ضيف سياق، قرّر، اتصرف، سجّل|الأدوات: SIEM (زي Splunk أو Sentinel) وEDR وأدوات أمان الإيميل ونظام تذاكر|المهارات: صبر وتركيز وأساسيات شبكات وقراية logs','A common first job in cyber security.','وظيفة أولى شائعة في الأمن السيبراني.'],
['Incident responder and cloud engineer','الـ incident responder والـ cloud engineer','Incident response starts with preparation and ends with learning from the incident|A cloud engineer fixes mistakes like an open storage bucket|Least privilege: give only the access that is needed','الاستجابة للحوادث بتبدأ بالتجهيز وبتخلص بالتعلم من الحادثة|الـ cloud engineer بيصلّح أخطاء زي storage bucket مفتوح|Least privilege: ادّي الصلاحية المطلوبة بس','Same habits in every role: ethics, permission, clear reporting.','نفس العادات في كل وظيفة: أخلاقيات وإذن وتقرير واضح.']]}]};

{k:'cn',c:'mob',q:['Why might a food delivery app need location, camera and notifications?','ليه تطبيق توصيل أكل ممكن يحتاج الموقع والكاميرا والإشعارات؟'],a:['Location finds nearby restaurants and your delivery address, the camera can scan a QR code or photograph a problem, and notifications tell you the order status. Each one touches privacy, so the app must ask permission and explain why.','الموقع بيدوّر على مطاعم قريبة وعنوان التوصيل، والكاميرا ممكن تمسح QR أو تصوّر مشكلة، والإشعارات بتقولك حالة الأوردر. وكل واحدة بتمس الخصوصية، فالتطبيق لازم يطلب إذن ويوضّح السبب.'],s:['Ask what the feature really needs|Request permission only when it is needed|Explain why in plain words|Let the user say no and keep the app usable','اسأل الميزة محتاجة إيه بالظبط|اطلب الإذن وقت الحاجة بس|وضّح السبب بكلام بسيط|سيب المستخدم يرفض وخلّي التطبيق شغال']},
{k:'cn',c:'mob',q:['Which computers can build and run an iOS app, and which can build Android?','أنهي أجهزة تقدر تبني وتشغّل تطبيق iOS، وأنهي تبني Android؟'],a:['iOS needs a Mac (macOS with Xcode). It is not possible on Windows or Linux. Android and web apps can be built on any machine with Android Studio. Windows apps run only on Windows and Linux apps only on Linux.','الـ iOS محتاج Mac (macOS ومعاه Xcode). مش ممكن على ويندوز ولا لينكس. أما Android والويب فبيتبنوا على أي جهاز بـ Android Studio. وتطبيقات ويندوز بتشتغل على ويندوز بس، ولينكس على لينكس بس.'],s:['iOS on macOS: install Xcode, configure its command-line tools, create an iOS simulator|Android on any OS: install Android Studio, then the SDK, command-line tools and build tools, then create an emulator','iOS على macOS: نزّل Xcode وظبّط أدوات الـ command-line وكوّن simulator|Android على أي نظام: نزّل Android Studio وبعدين الـ SDK وأدوات الـ command-line والـ build وكوّن emulator']},
{k:'cn',c:'mob',q:['Function or class? Explain area(4, 5) and Rectangle(4, 5).area().','Function ولا class؟ اشرح area(4, 5) وRectangle(4, 5).area().'],a:['A function performs an action; a class models a thing. Both give 20. Use a function for one operation, like calculating a total or validating a password. Use a class when you need an object with data and behaviour, like Student, Account or Car.','الـ function بتعمل فعل، والـ class بيمثّل شيء. الاتنين بيدّوا 20. استخدم function لعملية واحدة زي حساب إجمالي أو التحقق من باسورد. واستخدم class لما تحتاج object ليه داتا وسلوك زي Student أو Account أو Car.'],code:`// Function: an action

  int area() => w * h;
}

{k:'cn',c:'sec',q:['On a login screen, point out the input, the button, the error message and the protected area.','في شاشة لوجين، حدّد الـ input والزرار ورسالة الخطأ والمنطقة المحمية.'],a:['Input: the email and password fields. Button: Login. Error message: the text under the form, such as “Not checked yet” or a wrong-password message. Protected area: the screen you only reach after a successful login. Thinking: input, check, decision, access.','الـ input: خانات الإيميل والباسورد. الزرار: Login. رسالة الخطأ: النص اللي تحت الفورم زي “Not checked yet” أو رسالة باسورد غلط. المنطقة المحمية: الشاشة اللي مبتوصلهاش غير بعد لوجين ناجح. والتفكير: input ثم check ثم decision ثم access.'],s:['Find the fields where the user types|Find the button that starts the check|Find where problems are reported|Name what stays hidden until access is granted','دوّر على الخانات اللي المستخدم بيكتب فيها|دوّر على الزرار اللي بيبدأ الفحص|دوّر على مكان ظهور المشاكل|سمّي اللي بيفضل مخفي لحد ما الدخول يتسمح']},
{k:'ms',tg:['Waterfall or agile','Waterfall ولا agile'],q:['A client wants a brand-new app but is not sure which features they need yet. Waterfall or agile?','عميل عايز تطبيق جديد خالص بس مش متأكد محتاج مميزات إيه. Waterfall ولا agile؟'],a:['Agile. Requirements are uncertain and likely to change, and agile expects that: it plans continuously, adapts scope and releases often. Waterfall fits repeat projects with well-defined requirements.','الـ agile. المتطلبات مش مؤكدة وغالباً هتتغير، والـ agile متوقع ده: بيخطط باستمرار وبيعدّل النطاق وبيطلّع إصدارات كتير. أما الـ waterfall فمناسب للمشاريع المتكررة اللي متطلباتها واضحة.'],s:['Ask: are the requirements well defined and stable?|If yes: waterfall with fixed price, fixed deliverables and strict timeline|If no: agile with flexible scope, payment by hours or effort and flexible duration|Here the answer is no, so choose agile','اسأل: هل المتطلبات واضحة وثابتة؟|لو أيوه: waterfall بسعر ثابت ومخرجات ثابتة وجدول صارم|لو لأ: agile بنطاق مرن ودفع بالساعات أو المجهود ومدة مرنة|هنا الإجابة لأ، فاختار agile']},
{k:'ms',tg:['Project charter','Project charter'],q:['What is a project charter, what do you need to write it, and who signs it?','يعني إيه project charter، وإيه اللي محتاجه عشان تكتبه، ومين بيوقّع عليه؟'],a:['A short document that formally recognises the project, gives direction on its objectives and how it will be managed, and announces it to the organisation. Inputs: statement of work, business case, agreements, environmental factors and organisational assets. Key stakeholders sign to show they agree on the need and the intent.','وثيقة قصيرة بتعترف رسمياً بالمشروع وبتدّي اتجاه لأهدافه وإزاي هيتدار وبتعلنه للمؤسسة. المدخلات: statement of work وbusiness case والاتفاقيات والعوامل البيئية وأصول المؤسسة. وأصحاب المصلحة الأساسيين بيوقّعوا عشان يبيّنوا إنهم موافقين على الحاجة والنية.'],s:['Gather the inputs|Write the one-page charter: title, dates, budget, objective, success criteria, approach, roles|Get sign-off (in the Campus App example: sponsor and project manager)|Share it with the organisation','اجمع المدخلات|اكتب الـ charter في صفحة: العنوان والتواريخ والميزانية والهدف ومعايير النجاح والأسلوب والأدوار|خد التوقيع (في مثال Campus App: الراعي ومدير المشروع)|شاركه مع المؤسسة']},
{k:'ms',tg:['Process groups','مجموعات العمليات'],q:['Name the five process groups in order and the key output of each.','اذكر مجموعات العمليات الخمسة بالترتيب والمخرج الأساسي لكل واحدة.'],a:['Initiating gives the project charter. Planning gives the project management plan. Executing gives deliverables, work performance data and change requests. Monitoring and controlling gives approved changes, the change log and plan updates. Closing gives the final product handed over and lessons learned. Monitoring and controlling runs alongside all the others.','الـ Initiating بيطلّع الـ project charter. والـ Planning بيطلّع خطة إدارة المشروع. والـ Executing بيطلّع المخرجات وبيانات أداء الشغل وطلبات التغيير. والـ Monitoring and controlling بيطلّع التغييرات المعتمدة والـ change log وتحديثات الخطة. والـ Closing بيطلّع تسليم المنتج النهائي والدروس المستفادة. والـ Monitoring and controlling شغال جنب كل الباقي.'],s:['1 Initiating: charter|2 Planning: management plan|3 Executing: deliverables|4 Monitoring & controlling: approved changes, change log|5 Closing: handover and lessons learned','1 Initiating: الـ charter|2 Planning: خطة الإدارة|3 Executing: المخرجات|4 Monitoring & controlling: تغييرات معتمدة وchange log|5 Closing: التسليم والدروس المستفادة']},
{k:'ms',tg:['Scope','النطاق'],q:['For the Campus App, name two things in scope and two out of scope. Why write down what is out?','في Campus App، اذكر حاجتين جوه النطاق وحاجتين برّاه. وليه نكتب اللي برّه؟'],a:['In scope: timetable, grades, notices, Android and iPhone, Arabic and English. Out of scope: paying fees, chat between students, library booking, tablet version, other universities. Writing down what is OUT leaves no space for assumptions.','جوه النطاق: الجدول والدرجات والإشعارات وAndroid وiPhone والعربي والإنجليزي. برّه النطاق: دفع المصاريف والشات بين الطلبة وحجز المكتبة ونسخة التابلت والجامعات التانية. وكتابة اللي برّه بتمنع الافتراضات.'],s:['List the features and platforms that are in|List what is deliberately out|Agree both lists with stakeholders|Point back to the lists when new requests appear','اكتب المميزات والمنصات اللي جوه|اكتب اللي برّه قصداً|اتفق على القايمتين مع أصحاب المصلحة|ارجع للقايمتين لما تيجي طلبات جديدة']},
{k:'ms',tg:['Requirements','المتطلبات'],q:['Rewrite “The app should be fast” as a testable requirement.','أعد كتابة “The app should be fast” كمتطلب قابل للاختبار.'],a:['Each screen opens in under 2 seconds on 4G. A good requirement is testable: it has a number and a condition you can check.','كل شاشة بتفتح في أقل من ثانيتين على 4G. المتطلب الكويس قابل للاختبار: فيه رقم وشرط تقدر تتأكد منه.'],s:['Find the vague word (fast)|Pick something you can measure (opening time)|Add a number (under 2 seconds)|Add the condition (on 4G)','لاقي الكلمة الغامضة (fast)|اختار حاجة تقدر تقيسها (وقت الفتح)|ضيف رقم (أقل من ثانيتين)|ضيف الشرط (على 4G)']},
{k:'ms',tg:['MoSCoW','MoSCoW'],q:['Sort these Campus App features with MoSCoW: login, exam reminders, dark mode, paying fees.','رتّب مميزات Campus App دي بـ MoSCoW: تسجيل الدخول وتذكير الامتحانات والوضع الغامق ودفع المصاريف.'],a:['Must: login (and seeing the timetable). Should: exam reminders. Could: dark mode. Won’t (this time): paying fees in the app.','Must: تسجيل الدخول (ورؤية الجدول). Should: تذكير الامتحانات. Could: الوضع الغامق. Won’t (المرة دي): دفع المصاريف في التطبيق.'],s:['Does the product fail without it? Must|Important, but there is a workaround? Should|Nice to have if time allows? Could|Agreed as not in this version? Won’t','المنتج بيفشل من غيرها؟ Must|مهمة بس فيه بديل؟ Should|حلوة لو الوقت يسمح؟ Could|متفق إنها مش في النسخة دي؟ Won’t']},
{k:'ms',tg:['WBS','WBS'],q:['Build a WBS for the Campus App and explain the 100% rule.','ابني WBS لتطبيق Campus App واشرح قاعدة الـ 100%.'],a:['Five branches: 1 Project management, 2 Requirements, 3 Design, 4 Build, 5 Test and launch, each split into smaller boxes. The 100% rule: the WBS contains all the work and nothing else, and the lowest boxes are work packages.','خمس فروع: 1 إدارة المشروع، 2 المتطلبات، 3 التصميم، 4 البناء، 5 الاختبار والإطلاق، وكل فرع متقسّم لمربعات أصغر. قاعدة الـ 100%: الـ WBS فيه كل الشغل ومفيهوش حاجة زيادة، وأصغر المربعات هي work packages.'],s:['Write the project name at the top|Split it into major branches|Break each branch into work packages|Check that all the work is there and nothing extra','اكتب اسم المشروع فوق|قسّمه لفروع رئيسية|قسّم كل فرع لـ work packages|اتأكد إن كل الشغل موجود ومفيش حاجة زيادة']},
{k:'ms',tg:['Change control','التحكم في التغيير'],q:['A stakeholder asks for a new feature in the middle of the project. What are the steps?','صاحب مصلحة طلب ميزة جديدة في نص المشروع. إيه الخطوات؟'],a:['Every change goes through the same door: write the change request, analyse its impact on scope, time, cost and quality, decide (approve, reject or postpone) with the right people, update the plan, documents and change log, then tell everyone.','أي تغيير بيعدّي من نفس الباب: اكتب طلب التغيير، وحلل تأثيره على النطاق والوقت والتكلفة والجودة، وقرّر (وافق أو ارفض أو أجّل) مع الناس المناسبة، وحدّث الخطة والمستندات والـ change log، وبعدين بلّغ الكل.'],s:['1 Change request: what, why, who asked|2 Impact analysis|3 Decision|4 Update plan, documents and change log|5 Tell everyone','1 طلب التغيير: إيه وليه ومين طلب|2 تحليل التأثير|3 القرار|4 تحديث الخطة والمستندات والـ change log|5 بلّغ الكل']},
{k:'eg',tg:['LinkedIn','LinkedIn'],q:['Improve this LinkedIn headline: “Student”.','حسّن الـ headline ده على LinkedIn: “Student”.'],a:['Say what you study and what you are learning, for example “Computer Science student | learning cyber security on TryHackMe | building apps with Flutter”. A headline works harder when it shows direction.','قول بتدرس إيه وبتتعلم إيه، مثلاً “Computer Science student | learning cyber security on TryHackMe | building apps with Flutter”. الـ headline بيشتغل أحسن لما بيبيّن اتجاهك.'],s:['Say who you are|Add your focus area|Add one proof, such as a platform or project','قول إنت مين|ضيف مجالك|ضيف دليل واحد زي منصة أو مشروع']},
{k:'eg',tg:['OSINT','OSINT'],q:['What is OSINT and what are its five stages?','يعني إيه OSINT وإيه مراحله الخمسة؟'],a:['Open Source Intelligence is information gathered from public sources, legally. The cycle is plan, collect, process, analyse, report. Public does not mean harmless, so ethics and permission still matter.','الـ Open Source Intelligence هو معلومات بتتجمع من مصادر عامة بشكل قانوني. الدورة: خطط، اجمع، عالج، حلل، اكتب تقرير. وعام مش معناه من غير خطر، فالأخلاقيات والإذن لسه مهمين.'],s:['Plan: what do I need to know and why?|Collect from public sources|Process: clean and organise|Analyse: what does it mean?|Report: share findings clearly','خطط: محتاج أعرف إيه وليه؟|اجمع من مصادر عامة|عالج: نضّف ونظّم|حلل: ده معناه إيه؟|اكتب تقرير: شارك النتايج بوضوح']},
{k:'eg',tg:['Google dorks','Google dorks'],q:['Write a search that finds only PDF files on one website.','اكتب بحث يلاقي ملفات PDF بس على موقع واحد.'],a:['Combine site: with filetype: and leave no space after the colons. Only search public pages, and only practise on the lab target.','اربط site: مع filetype: ومتسيبش مسافة بعد النقطتين. ابحث في الصفحات العامة بس، وتدرّب على هدف اللاب بس.'],code:'site:lab-target.example filetype:pdf'},
{k:'eg',tg:['Digital footprint','البصمة الرقمية'],q:['Give one active and one passive digital footprint example.','اديني مثال لبصمة رقمية نشطة ومثال لبصمة سلبية.'],a:['Active: a post, a profile or a form you fill in. Passive: a tag from a friend, a data breach, tracking logs or file metadata. Small facts combined can help someone guess passwords or impersonate you.','النشطة: بوست أو بروفايل أو فورم بتملاه. السلبية: تاج من صاحبك أو تسريب بيانات أو logs تتبّع أو metadata ملف. والحقائق الصغيرة لما تتجمع ممكن تساعد حد يخمّن باسوردك أو ينتحل شخصيتك.'],s:['Search your own name first|List what you posted (active)|List what others or systems recorded (passive)|Tighten privacy settings and remove what you do not need','دوّر على اسمك إنت الأول|اكتب اللي نشرته (نشطة)|اكتب اللي غيرك أو السيستمز سجّلوه (سلبية)|شدّد إعدادات الخصوصية وامسح اللي مش محتاجه']},
{k:'eg',tg:['Ethics','الأخلاقيات'],q:['During a lab you find a document with sensitive data. What do you do?','وإنت في لاب لقيت مستند فيه داتا حساسة. تعمل إيه؟'],a:['Stop. Do not open, copy or use it, and report it to the owner or your instructor. Permission only covers what the scope says.','وقّف. متفتحهوش ولا تنسخه ولا تستخدمه، وبلّغ عنه لصاحبه أو للمحاضر. الإذن بيغطي بس اللي النطاق قايله.'],s:['Stop right away|Do not open, copy or share it|Write down where you found it|Report it to the owner or your instructor','وقّف فوراً|متفتحش ولا تنسخ ولا تشارك|اكتب لقيته فين|بلّغ صاحبه أو المحاضر']},
{k:'eg',tg:['Roles','الوظايف'],q:['Who watches alerts, who breaks in with permission, who limits the damage of a real attack, and who builds cloud systems safely?','مين بيراقب التنبيهات، ومين بيخترق بإذن، ومين بيقلّل ضرر هجوم حقيقي، ومين بيبني سيستمز الكلاود بأمان؟'],a:['SOC analyst watches alerts. Penetration tester breaks in with written permission. Incident responder limits the damage. Cloud security engineer builds cloud systems safely.','الـ SOC analyst بيراقب التنبيهات. الـ penetration tester بيخترق بإذن مكتوب. الـ incident responder بيقلّل الضرر. الـ cloud security engineer بيبني سيستمز الكلاود بأمان.']},
{k:'eg',tg:['SMART goal','هدف SMART'],q:['Turn “I want to learn cyber security” into a SMART goal.','حوّل “I want to learn cyber security” لهدف SMART.'],a:['Example: “I will complete the first module of a beginner TryHackMe path by the end of next month, two evenings a week.” It is specific, measurable (one module), achievable, relevant and time-bound.','مثال: “هخلّص أول موديول من beginner path في TryHackMe قبل آخر الشهر الجاي، يومين في الأسبوع بالليل.” هو محدد وقابل للقياس (موديول واحد) وممكن ومناسب وليه ميعاد.'],s:['Specific: which path and module?|Measurable: how will you know it is done?|Achievable: two evenings a week|Relevant: ties to your goal|Time-bound: a clear date','Specific: أنهي path وموديول؟|Measurable: هتعرف إنه خلص إزاي؟|Achievable: يومين في الأسبوع|Relevant: مربوط بهدفك|Time-bound: تاريخ واضح']}];

{m:['SMS: "Your parcel is on hold. Pay a 15 EGP customs fee now: bit.ly/x7Qp2"','رسالة SMS: "شحنتك معلّقة. ادفع 15 جنيه جمارك دلوقتي: bit.ly/x7Qp2"'],p:1,e:['Phishing: a shortened link hides the real destination, and it asks for a payment.','Phishing: اللينك المختصر بيخبّي الوجهة الحقيقية وبيطلب دفع.']},
{m:['Chat message from a coworker\'s brand-new account: "Are you at your desk? I need gift cards urgently, I will pay you back."','رسالة شات من حساب جديد لزميل: "إنت على مكتبك؟ محتاج كروت هدايا بسرعة وهرجّعلك فلوسك."'],p:1,e:['Phishing: urgency, a new account, and a request for gift cards. Check with the person on another channel.','Phishing: استعجال وحساب جديد وطلب كروت هدايا. اتأكد من الشخص من قناة تانية.']},
{m:['Email: "Your password was changed from a new device. If this was you, ignore this. If not, open the app yourself and check Security settings."','إيميل: "الباسورد اتغيّر من جهاز جديد. لو إنت اللي عملت كده تجاهل الرسالة. لو لأ افتح التطبيق بنفسك وراجع إعدادات الأمان."'],p:0,e:['Legit: no link to click, and it tells you to go to the app yourself.','سليم: مفيش لينك تدوس عليه وبيقولك تفتح التطبيق بنفسك.']},
{m:['Email from an unknown sender with the attachment Invoice_2026.pdf.exe: "Please open urgently."','إيميل من حد مش معروف فيه مرفق Invoice_2026.pdf.exe: "افتحه ضروري."'],p:1,e:['Phishing: a double extension (.pdf.exe) means it is really a program.','Phishing: الامتداد المزدوج (.pdf.exe) معناه إنه برنامج في الحقيقة.']}
];
function phDraw(){const e=$('#gmPhish');if(!e)return;const n=gm.ph.filter(x=>x!=null).length,ok=gm.ph.filter((x,i)=>x!=null&&x===PH[i].p).length;
 e.innerHTML=PH.map((p,i)=>{const a=gm.ph[i];return `<div class="gmph"><p dir="auto">${esc(P(p.m))}</p>`+(a==null?`<button class="x" data-act="ph:${i}:1">🎣 ${esc(T('cgIsPhish'))}</button> <button class="x" data-act="ph:${i}:0">✅ ${esc(T('cgIsLegit'))}</button>`:`<p class="${a===p.p?'gmok':'gmno'}">${a===p.p?'✔':'✘'} ${esc(P(p.e))}</p>`)+'</div>'}).join('')+`<p class="small">${esc(T('cgPhScore'))}: ${ok}/${PH.length}${n===PH.length?` <button class="x" data-act="ph:reset">${esc(T('cgPhAgain'))}</button>`:''}</p>`}

const CGLINKS=[['TryHackMe','https://tryhackme.com',['Guided rooms and beginner paths in the browser','غرف موجّهة ومسارات للمبتدئين على المتصفح']],['picoCTF','https://picoctf.org',['Beginner-friendly capture-the-flag challenges','تحديات capture-the-flag مناسبة للمبتدئين']],['OverTheWire: Bandit','https://overthewire.org/wargames/bandit/',['Learn the Linux command line by solving levels','اتعلم الـ command line بتاع لينكس بحل المستويات']],['Hack The Box','https://www.hackthebox.com',['Labs and challenges once you are ready for more','لابات وتحديات لما تبقى جاهز لأكتر']],['PortSwigger Web Security Academy','https://portswigger.net/web-security',['Free, hands-on web security labs','لابات أمن ويب مجانية وعملية']],['CryptoHack','https://cryptohack.org',['Learn cryptography by solving puzzles','اتعلم الـ cryptography بحل الألغاز']],['Gandalf by Lakera','https://gandalf.lakera.ai',['Trick an AI into revealing a password (prompt injection)','خلّي الـ AI يكشف باسورد (prompt injection)']],['CyberChef','https://gchq.github.io/CyberChef/',['Encode, decode and analyse data. Great for levels 2 and 3','ترميز وفك ترميز وتحليل داتا. حلو للمستويين 2 و3']]];

function gamesInit(){
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
 const lk=$('#gmLinks');if(lk)lk.innerHTML=CGLINKS.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener noreferrer"><b>${esc(x[0])}</b><span>${esc(P(x[2]))}</span></a>`).join('');
 if(!gm.started){gm.started=1;gmLoad(gm.lv)}else{gmBrief();gmChips()}
 phDraw()}
Object.assign(ACT,{
 gm:a=>{const[k,v]=a.split(':');
  if(k==='lv'){gmLoad(+v)}
  else if(k==='hint'){gmPrint(P(CGL[gm.lv].h),'d')}
  else if(k==='reset'){gm.done=[];sv('cgd','[]');$('#gmLog').innerHTML='';gmLoad(0)}
  const i=$('#gmIn');if(i)i.focus()},
 ph:a=>{if(a==='reset'){gm.ph=[];phDraw();return}const[i,j]=a.split(':').map(Number);if(gm.ph[i]==null){gm.ph[i]=j;phDraw()}}
});
$('#gmForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#gmIn'),v=i.value.trim();i.value='';if(!v)return;gm.hist.push(v);gm.hi=gm.hist.length;gmRun(v)});
$('#gmIn').addEventListener('keydown',e=>{const i=e.target;if(e.key==='ArrowUp'&&gm.hi>0){e.preventDefault();i.value=gm.hist[--gm.hi]}else if(e.key==='ArrowDown'){e.preventDefault();gm.hi=Math.min(gm.hi+1,gm.hist.length);i.value=gm.hist[gm.hi]||''}});
$('#gmTerm').addEventListener('click',()=>{if(!String(getSelection()))$('#gmIn').focus()});

lang=ld('lang','en');l=lang==='ar'?1:0;route();
</script>
