{k:'cn',c:'sec',q:['On a login screen, point out the input, the button, the error message and the protected area.','في شاشة لوجين، حدّد الـ input والزرار ورسالة الخطأ والمنطقة المحمية.'],a:['Input: the email and password fields. Button: Login. Error message: the text under the form, such as “Not checked yet” or a wrong-password message. Protected area: the screen you only reach after a successful login. Thinking: input, check, decision, access.','الـ input: خانات الإيميل والباسورد. الزرار: Login. رسالة الخطأ: النص اللي تحت الفورم زي “Not checked yet” أو رسالة باسورد غلط. المنطقة المحمية: الشاشة اللي مبتوصلهاش غير بعد لوجين ناجح. والتفكير: input ثم check ثم decision ثم access.'],s:['Find the fields where the user types|Find the button that starts the check|Find where problems are reported|Name what stays hidden until access is granted','دوّر على الخانات اللي المستخدم بيكتب فيها|دوّر على الزرار اللي بيبدأ الفحص|دوّر على مكان ظهور المشاكل|سمّي اللي بيفضل مخفي لحد ما الدخول يتسمح']},
{k:'ms',tg:['Waterfall or agile','Waterfall ولا agile'],q:['A client wants a brand-new app but is not sure which features they need yet. Waterfall or agile?','عميل عايز تطبيق جديد خالص بس مش متأكد محتاج مميزات إيه. Waterfall ولا agile؟'],a:['Agile. Requirements are uncertain and likely to change, and agile expects that: it plans continuously, adapts scope and releases often. Waterfall fits repeat projects with well-defined requirements.','الـ agile. المتطلبات مش مؤكدة وغالباً هتتغير، والـ agile متوقع ده: بيخطط باستمرار وبيعدّل النطاق وبيطلّع إصدارات كتير. أما الـ waterfall فمناسب للمشاريع المتكررة اللي متطلباتها واضحة.'],s:['Ask: are the requirements well defined and stable?|If yes: waterfall with fixed price, fixed deliverables and strict timeline|If no: agile with flexible scope, payment by hours or effort and flexible duration|Here the answer is no, so choose agile','اسأل: هل المتطلبات واضحة وثابتة؟|لو أيوه: waterfall بسعر ثابت ومخرجات ثابتة وجدول صارم|لو لأ: agile بنطاق مرن ودفع بالساعات أو المجهود ومدة مرنة|هنا الإجابة لأ، فاختار agile']},
{k:'ms',tg:['Project charter','Project charter'],q:['What is a project charter, what do you need to write it, and who signs it?','يعني إيه project charter، وإيه اللي محتاجه عشان تكتبه، ومين بيوقّع عليه؟'],a:['A short document that formally recognises the project, gives direction on its objectives and how it will be managed, and announces it to the organisation. Inputs: statement of work, business case, agreements, environmental factors and organisational assets. Key stakeholders sign to show they agree on the need and the intent.','وثيقة قصيرة بتعترف رسمياً بالمشروع وبتدّي اتجاه لأهدافه وإزاي هيتدار وبتعلنه للمؤسسة. المدخلات: statement of work وbusiness case والاتفاقيات والعوامل البيئية وأصول المؤسسة. وأصحاب المصلحة الأساسيين بيوقّعوا عشان يبيّنوا إنهم موافقين على الحاجة والنية.'],s:['Gather the inputs|Write the one-page charter: title, dates, budget, objective, success criteria, approach, roles|Get sign-off (in the Campus App example: sponsor and project manager)|Share it with the organisation','اجمع المدخلات|اكتب الـ charter في صفحة: العنوان والتواريخ والميزانية والهدف ومعايير النجاح والأسلوب والأدوار|خد التوقيع (في مثال Campus App: الراعي ومدير المشروع)|شاركه مع المؤسسة']},
{k:'ms',tg:['Process groups','مجموعات العمليات'],q:['Name the five process groups in order and the key output of each.','اذكر مجموعات العمليات الخمسة بالترتيب والمخرج الأساسي لكل واحدة.'],a:['Initiating gives the project charter. Planning gives the project management plan. Executing gives deliverables, work performance data and change requests. Monitoring and controlling gives approved changes, the change log and plan updates. Closing gives the final product handed over and lessons learned. Monitoring and controlling runs alongside all the others.','الـ Initiating بيطلّع الـ project charter. والـ Planning بيطلّع خطة إدارة المشروع. والـ Executing بيطلّع المخرجات وبيانات أداء الشغل وطلبات التغيير. والـ Monitoring and controlling بيطلّع التغييرات المعتمدة والـ change log وتحديثات الخطة. والـ Closing بيطلّع تسليم المنتج النهائي والدروس المستفادة. والـ Monitoring and controlling شغال جنب كل الباقي.'],s:['1 Initiating: charter|2 Planning: management plan|3 Executing: deliverables|4 Monitoring & controlling: approved changes, change log|5 Closing: handover and lessons learned','1 Initiating: الـ charter|2 Planning: خطة الإدارة|3 Executing: المخرجات|4 Monitoring & controlling: تغييرات معتمدة وchange log|5 Closing: التسليم والدروس المستفادة']},
{k:'ms',tg:['Scope','النطاق'],q:['For the Campus App, name two things in scope and two out of scope. Why write down what is out?','في Campus App، اذكر حاجتين جوه النطاق وحاجتين برّاه. وليه نكتب اللي برّه؟'],a:['In scope: timetable, grades, notices, Android and iPhone, Arabic and English. Out of scope: paying fees, chat between students, library booking, tablet version, other universities. Writing down what is OUT leaves no space for assumptions.','جوه النطاق: الجدول والدرجات والإشعارات وAndroid وiPhone والعربي والإنجليزي. برّه النطاق: دفع المصاريف والشات بين الطلبة وحجز المكتبة ونسخة التابلت والجامعات التانية. وكتابة اللي برّه بتمنع الافتراضات.'],s:['List the features and platforms that are in|List what is deliberately out|Agree both lists with stakeholders|Point back to the lists when new requests appear','اكتب المميزات والمنصات اللي جوه|اكتب اللي برّه قصداً|اتفق على القايمتين مع أصحاب المصلحة|ارجع للقايمتين لما تيجي طلبات جديدة']},
{k:'ms',tg:['Requirements','المتطلبات'],q:['Rewrite “The app should be fast” as a testable requirement.','أعد كتابة “The app should be fast” كمتطلب قابل للاختبار.'],a:['Each screen opens in under 2 seconds on 4G. A good requirement is testable: it has a number and a condition you can check.','كل شاشة بتفتح في أقل من ثانيتين على 4G. المتطلب الكويس قابل للاختبار: فيه رقم وشرط تقدر تتأكد منه.'],s:['Find the vague word (fast)|Pick something you can measure (opening time)|Add a number (under 2 seconds)|Add the condition (on 4G)','لاقي الكلمة الغامضة (fast)|اختار حاجة تقدر تقيسها (وقت الفتح)|ضيف رقم (أقل من ثانيتين)|ضيف الشرط (على 4G)']},
{k:'ms',tg:['MoSCoW','MoSCoW'],q:['Sort these Campus App features with MoSCoW: login, exam reminders, dark mode, paying fees.','رتّب مميزات Campus App دي بـ MoSCoW: تسجيل الدخول وتذكير الامتحانات والوضع الغامق ودفع المصاريف.'],a:['Must: login (and seeing the timetable). Should: exam reminders. Could: dark mode. Won’t (this time): paying fees in the app.','Must: تسجيل الدخول (ورؤية الجدول). Should: تذكير الامتحانات. Could: الوضع الغامق. Won’t (المرة دي): دفع المصاريف في التطبيق.'],s:['Does the product fail without it? Must|Important, but there is a workaround? Should|Nice to have if time allows? Could|Agreed as not in this version? Won’t','المنتج بيفشل من غيرها؟ Must|مهمة بس فيه بديل؟ Should|حلوة لو الوقت يسمح؟ Could|متفق إنها مش في النسخة دي؟ Won’t']},
{k:'ms',tg:['WBS','WBS'],q:['Build a WBS for the Campus App and explain the 100% rule.','ابني WBS لتطبيق Campus App واشرح قاعدة الـ 100%.'],a:['Five branches: 1 Project management, 2 Requirements, 3 Design, 4 Build, 5 Test and launch, each split into smaller boxes. The 100% rule: the WBS contains all the work and nothing else, and the lowest boxes are work packages.','خمس فروع: 1 إدارة المشروع، 2 المتطلبات، 3 التصميم، 4 البناء، 5 الاختبار والإطلاق، وكل فرع متقسّم لمربعات أصغر. قاعدة الـ 100%: الـ WBS فيه كل الشغل ومفيهوش حاجة زيادة، وأصغر المربعات هي work packages.'],s:['Write the project name at the top|Split it into major branches|Break each branch into work packages|Check that all the work is there and nothing extra','اكتب اسم المشروع فوق|قسّمه لفروع رئيسية|قسّم كل فرع لـ work packages|اتأكد إن كل الشغل موجود ومفيش حاجة زيادة']},
{k:'ms',tg:['Change control','التحكم في التغيير'],q:['A stakeholder asks for a new feature in the middle of the project. What are the steps?','صاحب مصلحة طلب ميزة جديدة في نص المشروع. إيه الخطوات؟'],a:['Every change goes through the same door: write the change request, analyse its impact on scope, time, cost and quality, decide (approve, reject or postpone) with the right people, update the plan, documents and change log, then tell everyone.','أي تغيير بيعدّي من نفس الباب: اكتب طلب التغيير، وحلل تأثيره على النطاق والوقت والتكلفة والجودة، وقرّر (وافق أو ارفض أو أجّل) مع الناس المناسبة، وحدّث الخطة والمستندات والـ change log، وبعدين بلّغ الكل.'],s:['1 Change request: what, why, who asked|2 Impact analysis|3 Decision|4 Update plan, documents and change log|5 Tell everyone','1 طلب التغيير: إيه وليه ومين طلب|2 تحليل التأثير|3 القرار|4 تحديث الخطة والمستندات والـ change log|5 بلّغ الكل']},
{k:'ms',tg:['Contract types','أنواع العقود'],q:['Name the four contract types and say when each one fits.','اذكر أنواع العقود الأربعة وامتى كل واحد مناسب.'],a:['Fixed price: clearly defined work, so the supplier carries the cost risk. Time and materials: the amount of work is unknown, so you pay for the time and materials used. Cost-reimbursable: new or research work, so you pay the real costs plus a fee. Unit price: a set price per unit, such as per metre or per laptop, and you pay for the quantity delivered.','Fixed price: شغل واضح، فالمورد شايل مخاطرة التكلفة. Time and materials: حجم الشغل مجهول، فبتدفع على الوقت والخامات المستخدمة. Cost-reimbursable: شغل جديد أو بحثي، فبتدفع التكاليف الحقيقية زائد أتعاب. Unit price: سعر ثابت للوحدة زي المتر أو اللابتوب وبتدفع على الكمية اللي اتسلّمت.'],s:['Is the work clearly defined? Fixed price|Is the amount of work unknown? Time and materials|Is it new, so nobody can predict the cost? Cost-reimbursable|Is the unit clear but the quantity not known yet? Unit price','الشغل واضح؟ Fixed price|حجم الشغل مجهول؟ Time and materials|جديد ومحدش يقدر يتوقع تكلفته؟ Cost-reimbursable|الوحدة واضحة والكمية لسه مش معروفة؟ Unit price']},
{k:'ms',tg:['Choose a contract','اختار العقد'],q:['Choose a contract and say why: a 5-page website exactly like a design you have, an expert for “a few days”, research into a new AI chatbot, network cable of unknown length, 50 identical laptops.','اختار العقد وقول ليه: موقع 5 صفحات زي تصميم عندك بالظبط، خبير “كام يوم”، بحث في AI chatbot جديد، كابل شبكة طوله مجهول، 50 لابتوب متطابق.'],a:['1 Fixed price: the scope is clear and finished. 2 Time and materials: you do not know how many days. 3 Cost-reimbursable: nobody has built it, so nobody can predict the cost. 4 Unit price: pay per metre once the length is known. 5 Unit price (per laptop times 50), and a fixed price for the whole order also works because the quantity is known.','1 Fixed price: النطاق واضح ومكتمل. 2 Time and materials: مش عارف كام يوم. 3 Cost-reimbursable: محدش عمله قبل كده فمحدش يقدر يتوقع التكلفة. 4 Unit price: بتدفع للمتر لما الطول يتعرف. 5 Unit price (سعر اللابتوب × 50)، وfixed price للطلب كله شغال برضه لأن الكمية معروفة.'],s:['Is the work clearly defined? If yes, fixed price|Is the effort or cost unknown? Time and materials or cost-reimbursable|Is it a quantity of the same thing? Unit price','الشغل واضح؟ لو أيوه fixed price|الجهد أو التكلفة مجهولين؟ time and materials أو cost-reimbursable|كمية من نفس الحاجة؟ unit price']},
{k:'ms',tg:['Break-even','نقطة التعادل'],q:['Cloud rent is EGP 4,000 a month. Buying a server is EGP 60,000 up front plus EGP 1,500 a month. After how many months do the two cost the same?','إيجار الكلاود 4,000 جنيه في الشهر. وشراء سيرفر 60,000 جنيه في الأول زائد 1,500 جنيه في الشهر. بعد كام شهر التكلفتين يتساووا؟'],a:['24 months. Set rent equal to buy: 4,000x = 60,000 + 1,500x, so 2,500x = 60,000 and x = 24.','24 شهر. ساوي الإيجار بالشراء: 4,000x = 60,000 + 1,500x، يعني 2,500x = 60,000 و x = 24.'],s:['Write the cost of renting for x months: 4,000x|Write the cost of buying for x months: 60,000 + 1,500x|Make them equal and move the x terms to one side|Divide: x = 60,000 / 2,500 = 24','اكتب تكلفة الإيجار لـ x شهر: 4,000x|اكتب تكلفة الشراء لـ x شهر: 60,000 + 1,500x|ساوي بينهم وودّي حدود الـ x لناحية واحدة|اقسم: x = 60,000 ÷ 2,500 = 24'],code:`Rent:  4,000 x
Buy:   60,000 + 1,500 x
4,000 x = 60,000 + 1,500 x
2,500 x = 60,000
x = 24 months`},
{k:'ms',tg:['Rent or buy','إيجار ولا شراء'],q:['The project runs 18 months. Rent or buy? What if it runs 3 years?','المشروع بيشتغل 18 شهر. نأجّر ولا نشتري؟ وإيه لو بيشتغل 3 سنين؟'],a:['18 months: rent, because EGP 72,000 is less than EGP 87,000. 3 years (36 months): buy, because EGP 114,000 is less than EGP 144,000. The break-even is 24 months, so renting wins before it and buying wins after it.','18 شهر: نأجّر، لأن 72,000 جنيه أقل من 87,000. 3 سنين (36 شهر): نشتري، لأن 114,000 جنيه أقل من 144,000. نقطة التعادل 24 شهر، فالإيجار بيكسب قبلها والشراء بيكسب بعدها.'],s:['Rent for 18 months: 4,000 x 18 = 72,000|Buy for 18 months: 60,000 + 1,500 x 18 = 87,000|Rent for 36 months: 4,000 x 36 = 144,000|Buy for 36 months: 60,000 + 1,500 x 36 = 114,000','إيجار 18 شهر: 4,000 × 18 = 72,000|شراء 18 شهر: 60,000 + 1,500 × 18 = 87,000|إيجار 36 شهر: 4,000 × 36 = 144,000|شراء 36 شهر: 60,000 + 1,500 × 36 = 114,000']},
{k:'ms',tg:['Beyond the maths','ما بعد الحسابات'],q:['Name one reason, not money, to rent or buy anyway.','اذكر سبب واحد غير الفلوس عشان تأجّر أو تشتري برضه.'],a:['Skills: do we have people who can run a server? Speed: a cloud server is ready in minutes. Flexibility: it can grow or shrink with the users. Control and data: where is the data and who can see it? Any one of these is a valid answer, as long as you tie it to the Campus App.','المهارات: عندنا ناس تشغّل سيرفر؟ السرعة: سيرفر الكلاود بيجهز في دقايق. المرونة: بيكبر ويصغر مع المستخدمين. التحكم والداتا: الداتا فين ومين يشوفها؟ أي واحد منهم إجابة صح، بشرط تربطه بالـ Campus App.'],s:['Pick one reason|Say how it applies to the Campus App|Say which option it points to, rent or buy','اختار سبب واحد|قول بيتطبق على الـ Campus App إزاي|قول بيشاور على أنهي خيار، إيجار ولا شراء']},
{k:'ms',tg:['Outsourcing risks','مخاطر الـ outsourcing'],q:['Name three outsourcing risks and how to protect yourself from each.','اذكر تلات مخاطر في الـ outsourcing وإزاي تحمي نفسك من كل واحدة.'],a:['Lock-in: only the supplier can change the system, so get the source code and documents. Poor quality: it works in the demo but fails with real users, so write acceptance criteria and test before paying. Hidden costs: “that feature wasn’t in the price”, so use a clear SOW and price change requests in writing. The other two are data and security (confidentiality clause, follow data-protection law) and communication (weekly demos, one named contact on each side).','Lock-in: المورد بس يقدر يغيّر السيستم، فخد الـ source code والمستندات. جودة ضعيفة: شغال في الـ demo وبيفشل مع مستخدمين حقيقيين، فاكتب acceptance criteria واختبر قبل ما تدفع. تكاليف مخفية: “الميزة دي مكانتش في السعر”، فاستخدم SOW واضح وسعّر طلبات التغيير كتابةً. والاتنين التانيين الداتا والأمان (بند سرية والتزام بقانون حماية البيانات) والتواصل (demos أسبوعية وشخص واحد للتواصل من كل طرف).'],s:['Name the risk|Say what happens if it goes wrong|Give the protection you would agree in writing','سمّي المخاطرة|قول إيه اللي بيحصل لو غلطت|اذكر الحماية اللي هتتفق عليها كتابةً']},
{k:'ms',tg:['SOW and acceptance','الـ SOW والقبول'],q:['What is a SOW, and how do acceptance criteria stop a supplier delivering something that only works in the demo?','يعني إيه SOW، وإزاي الـ acceptance criteria بتمنع المورد يسلّم حاجة شغالة في الـ demo بس؟'],a:['A SOW (statement of work) says exactly what the supplier will deliver, so extra features have to be priced as written change requests. Acceptance criteria are written tests the product must pass, for example each screen opens in under 2 seconds on 4G. You test against them before you pay.','الـ SOW (statement of work) بيقول المورد هيسلّم إيه بالظبط، فأي ميزات زيادة لازم تتسعّر كطلبات تغيير مكتوبة. والـ acceptance criteria اختبارات مكتوبة المنتج لازم ينجح فيها، مثلاً كل شاشة بتفتح في أقل من ثانيتين على 4G. وبتختبر عليها قبل ما تدفع.'],s:['Write the SOW before signing|Write testable acceptance criteria|Test with real users, not only the demo|Pay when the criteria are met','اكتب الـ SOW قبل التوقيع|اكتب acceptance criteria قابلة للاختبار|اختبر مع مستخدمين حقيقيين مش الـ demo بس|ادفع لما المعايير تتحقق']},
{k:'ms',tg:['Weighted score','الـ weighted score'],q:['Score an idea 4 for user need, 3 for feasibility, 5 for gap left, 4 for mobile fit and 3 for risk. What is the weighted total out of 100?','قيّم فكرة: 4 لاحتياج المستخدم و3 للقابلية للتنفيذ و5 للفجوة المتبقية و4 للمناسبة للموبايل و3 للمخاطرة. المجموع الموزون من 100 كام؟'],a:['77. Weights are 30%, 25%, 20%, 15% and 10%. Add score times weight and divide by 5 (the top score), which gives (120 + 75 + 100 + 60 + 30) / 5 = 77.','77. الأوزان 30% و25% و20% و15% و10%. اجمع الدرجة × الوزن واقسم على 5 (أعلى درجة)، فيطلع (120 + 75 + 100 + 60 + 30) ÷ 5 = 77.'],s:['User need: 4 x 30 = 120|Feasibility: 3 x 25 = 75|Gap left: 5 x 20 = 100|Mobile fit: 4 x 15 = 60|Risk: 3 x 10 = 30|Total 385, divided by 5 = 77','احتياج المستخدم: 4 × 30 = 120|القابلية للتنفيذ: 3 × 25 = 75|الفجوة المتبقية: 5 × 20 = 100|المناسبة للموبايل: 4 × 15 = 60|المخاطرة: 3 × 10 = 30|المجموع 385 ÷ 5 = 77']},
{k:'ms',tg:['Proposal parts','أجزاء الـ proposal'],q:['List the eight parts of the project proposal, its length and its deadline.','اذكر أجزاء الـ project proposal التمانية وطوله وميعاد تسليمه.'],a:['Ideas, Studies, Search record, Comparison, Why this project, Business case, Stakeholders and Project brief. It is 6 to 8 pages plus a 10-minute presentation, due at the end of Week 6.','الأفكار والدراسات وسجل البحث والمقارنة وليه المشروع ده والـ business case وأصحاب المصلحة والـ project brief. طوله من 6 لـ 8 صفحات وبريزنتيشن 10 دقايق، والتسليم آخر الأسبوع 6.'],s:['1 Ideas|2 Studies|3 Search record|4 Comparison|5 Why this project|6 Business case|7 Stakeholders|8 Project brief','1 الأفكار|2 الدراسات|3 سجل البحث|4 المقارنة|5 ليه المشروع ده|6 الـ business case|7 أصحاب المصلحة|8 الـ project brief']},
{k:'ms',tg:['Why this project','ليه المشروع ده'],q:['What are the five questions in “Why we chose this project”, and how long should the answer be?','إيه الخمس أسئلة في “ليه اخترنا المشروع ده”، وطول الإجابة كام؟'],a:['The gap, the need, the choice, feasibility and success. The section is 400 to 600 words and every answer needs evidence.','الفجوة والاحتياج والاختيار والقابلية للتنفيذ والنجاح. القسم من 400 لـ 600 كلمة وكل إجابة محتاجة دليل.'],s:['1 The gap: what the studies leave unsolved|2 The need: evidence your users have the problem|3 The choice: why this idea and not your other two|4 Feasibility: why your team can deliver it in time|5 Success: how you will know it worked','1 الفجوة: الدراسات سابت إيه من غير حل|2 الاحتياج: دليل إن المستخدمين عندهم المشكلة|3 الاختيار: ليه الفكرة دي وملكش الفكرتين التانيين|4 القابلية للتنفيذ: ليه فريقك يقدر يسلّمها في الوقت|5 النجاح: هتعرف إنها نجحت إزاي']},
{k:'ms',tg:['Do nothing','Do nothing'],q:['Why must the business case include a “do nothing” option?','ليه الـ business case لازم يشمل خيار “do nothing”؟'],a:['It is the baseline. It shows what happens to the problem if nobody acts, so you can prove that your project is better than leaving things as they are. Alongside it you list your project, an alternative, a SWOT, and the costs and benefits.','هو الأساس للمقارنة. بيوضّح إيه اللي هيحصل للمشكلة لو محدش اتصرف، فتثبت إن مشروعك أحسن من إنك تسيب الأمور زي ما هي. وجنبه بتكتب مشروعك وبديل وSWOT والتكاليف والفوايد.'],s:['Describe the problem if nothing changes|Add your project and one alternative|Compare costs and benefits for each|Show why your project wins','وصّف المشكلة لو مفيش حاجة اتغيّرت|ضيف مشروعك وبديل واحد|قارن التكاليف والفوايد لكل واحد|وضّح ليه مشروعك بيكسب']},

function copyPlain(txt,b){const done=()=>{const o=b.textContent;b.textContent=T('copied');setTimeout(()=>b.textContent=o,1500)};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,done);else{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();done()}}
const u8ToHex=a=>[...a].map(b=>b.toString(16).padStart(2,'0')).join(' ');
const u8ToBin=a=>[...a].map(b=>b.toString(2).padStart(8,'0')).join(' ');
function cvText(s){try{return new TextEncoder().encode(s)}catch(e){return new Uint8Array()}}
function cvFromHex(h){const m=h.replace(/\s+/g,'').match(/.{1,2}/g)||[];return new Uint8Array(m.map(b=>parseInt(b,16)||0))}
function cvFromBin(b){const m=b.trim().split(/\s+/).filter(Boolean);return new Uint8Array(m.map(x=>parseInt(x,2)||0))}
function cvToB64(a){let s='';a.forEach(b=>s+=String.fromCharCode(b));try{return btoa(s)}catch(e){return ''}}
function cvFromB64(s){try{const bin=atob(s.trim());return new Uint8Array([...bin].map(c=>c.charCodeAt(0)))}catch(e){return new Uint8Array()}}
function cvRun(id){
 let bytes;
 if(id==='cv-text')bytes=cvText($('#cv-text').value);
 else if(id==='cv-b64')bytes=cvFromB64($('#cv-b64').value);
 else if(id==='cv-hex')bytes=cvFromHex($('#cv-hex').value);
 else bytes=cvFromBin($('#cv-bin').value);
 let txt='';try{txt=new TextDecoder('utf-8',{fatal:false}).decode(bytes)}catch(e){}
 if(id!=='cv-text')$('#cv-text').value=txt;
 if(id!=='cv-b64')$('#cv-b64').value=cvToB64(bytes);
 if(id!=='cv-hex')$('#cv-hex').value=u8ToHex(bytes);
 if(id!=='cv-bin')$('#cv-bin').value=u8ToBin(bytes);
}
function b64urlToStr(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return cvFromB64(s).reduce((a,b)=>a+String.fromCharCode(b),'')}
function jwtRun(){
 const v=$('#jw-in').value.trim(),o=$('#jw-out');if(!o)return;
 if(!v){o.innerHTML='';return}
 const parts=v.split('.');
 if(parts.length===3){
  try{
   const h=JSON.parse(b64urlToStr(parts[0])),p=JSON.parse(b64urlToStr(parts[1]));
   o.innerHTML=`<div class="jwtbox"><div class="dm c-net"><h3>${T('jwHeader')}</h3><pre>${esc(JSON.stringify(h,null,2))}</pre></div><div class="dm c-vrt"><h3>${T('jwPayload')}</h3><pre>${esc(JSON.stringify(p,null,2))}</pre></div><p class="small">${T('jwSig')}: <code class="wrap">${esc(parts[2])}</code></p></div>`;
  }catch(e){o.innerHTML=`<div class="res bad"><p>${T('jwErr')}</p></div>`}
 }else{
  const t1=(()=>{try{return decodeURIComponent(escape(atob(v)))}catch(e){return null}})();
  if(t1!==null)o.innerHTML=`<div class="dm c-net"><h3>${T('jwPlain')}</h3><pre class="wrap">${esc(t1)}</pre></div>`;
  else o.innerHTML=`<div class="res bad"><p>${T('jwErr')}</p></div>`;
 }
}
function ipToInt(ip){const p=ip.trim().split('.');if(p.length!==4)return null;const n=p.map(x=>+x);if(n.some(x=>isNaN(x)||x<0||x>255))return null;return((n[0]<<24)|(n[1]<<16)|(n[2]<<8)|n[3])>>>0}
function intToIp(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.')}
function subnetRun(){
 const o=$('#sn-out');if(!o)return;
 const ip=ipToInt($('#sn-ip').value),c=+$('#sn-cidr').value;
 if(ip===null||isNaN(c)||c<0||c>32){o.innerHTML=`<div class="res bad"><p>${T('snErr')}</p></div>`;return}
 const mask=c===0?0:(0xFFFFFFFF<<(32-c))>>>0,net=(ip&mask)>>>0,bcast=(net|(~mask>>>0))>>>0;
 let hmin,hmax,usable;
 if(c>=31){hmin=net;hmax=bcast;usable=c===32?1:2}
 else{hmin=net+1;hmax=bcast-1;usable=Math.max(0,bcast-net-1)}
 o.innerHTML=`<div class="kv c-sec"><div><b>${T('snNet')}</b><span>${intToIp(net)}</span></div><div><b>${T('snMask')}</b><span>${intToIp(mask)} (/${c})</span></div><div><b>${T('snBc')}</b><span>${intToIp(bcast)}</span></div><div><b>${T('snRange')}</b><span>${intToIp(hmin)} – ${intToIp(hmax)}</span></div><div><b>${T('snHosts')}</b><span>${usable.toLocaleString('en-US')}</span></div></div>`;
}

}

const gm={lv:Math.min(4,Math.max(0,+ld('cgl','0')||0)),S:null,started:0,hist:[],hi:0,ph:[],
 done:(()=>{try{const a=JSON.parse(ld('cgd','[]'));return Array.isArray(a)?a:[]}catch(e){return[]}})()};
const gmBase=p=>p.slice(p.lastIndexOf('/')+1),gmDir=p=>p.slice(0,p.lastIndexOf('/'))||'/';
const gmIsDir=p=>p==='/'||gm.S.d.includes(p);
function gmPath(p){if(!p)return gm.S.cwd;if(p==='~'||p.startsWith('~/'))p='/home/student'+p.slice(1);const o=[];for(const x of (p[0]==='/'?p:gm.S.cwd+'/'+p).split('/')){if(!x||x==='.')continue;if(x==='..')o.pop();else o.push(x)}return '/'+o.join('/')}
function gmFile(p){const q=gmPath(p),f=gm.S.f[q];if(f)return f.c;if(gmIsDir(q))throw new Error(p+': Is a directory');throw new Error(p+': No such file or directory')}
function gmSrc(f,inp){if(f.length)return f.map(gmFile).join('\n');if(inp!==undefined)return inp;throw new Error('missing file operand')}
function gmTok(s){const o=[];let c='',q='',has=false;for(const ch of s){if(q){if(ch===q)q='';else c+=ch}else if(ch==='"'||ch==="'"){q=ch;has=true}else if(/\s/.test(ch)){if(c||has){o.push(c);c='';has=false}}else c+=ch}if(c||has)o.push(c);return o}
const gmNopt=(a,d)=>{let n=d;const f=[];for(let i=0;i<a.length;i++){if(a[i]==='-n')n=+a[++i];else if(/^-\d+$/.test(a[i]))n=-a[i];else f.push(a[i])}return[n,f]};
const gmOct=m=>[...m].map(d=>[4,2,1].map((b,i)=>(+d&b)?'rwx'[i]:'-').join('')).join('');
const gmPs=()=>{const c=gm.S?gm.S.cwd:'/';const e=$('#gmPs');if(e)e.textContent='student@lab:'+(c==='/home/student'?'~':c.replace('/home/student','~'))+'$'};
function gmPrint(t,c){const L=$('#gmLog');if(!L)return;const d=document.createElement('div');d.className=c||'c';d.textContent=t;L.appendChild(d);L.scrollTop=L.scrollHeight}
function gmSolved(){return gm.done.filter(Boolean).length}
function gmMark(){gm.done[gm.lv]=true;sv('cgd',JSON.stringify(gm.done));gmChips()}

const CM={
 help:()=>'Commands:\n  ls [-a] [-l] [dir]   cd [dir]   pwd   cat file   head/tail [-n N] [file]\n  grep [-c -i -v] pattern [file]   cut -d" " -f N   sort [-n -r]   uniq [-c]   wc [-l]\n  base64 [-d] [file|text]   rot13 [file|text]   echo text   chmod +x file   ./file\n  whoami   level   hint   submit FLAG{...}   next   clear\nPipes work: cmd1 | cmd2',
 pwd:()=>gm.S.cwd,whoami:()=>'student',echo:a=>a.join(' '),
 clear:()=>{$('#gmLog').innerHTML='';return ''},
 level:()=>{const L=CGL[gm.lv];return P(L.t)+'\n'+P(L.b)},
 hint:()=>P(CGL[gm.lv].h),
 ls(a){const fl=a.filter(x=>x[0]==='-').join(''),t=a.find(x=>x[0]!=='-'),p=gmPath(t),F=gm.S.f;
  const row=(e)=>e[1]?'drwxr-xr-x student student 4096 '+gmBase(e[0]):F[e[0]].p+' student student '+String(F[e[0]].c.length).padStart(4)+' '+gmBase(e[0]);
  if(F[p])return fl.includes('l')?row([p,0]):gmBase(p);
  if(!gmIsDir(p))throw new Error("cannot access '"+t+"': No such file or directory");
  let en=[...gm.S.d.filter(x=>x!==p&&gmDir(x)===p).map(x=>[x,1]),...Object.keys(F).filter(x=>gmDir(x)===p).map(x=>[x,0])];
  if(!fl.includes('a'))en=en.filter(e=>gmBase(e[0])[0]!=='.');
  en.sort((x,y)=>gmBase(x[0]).localeCompare(gmBase(y[0])));
  return fl.includes('l')?en.map(row).join('\n'):en.map(e=>gmBase(e[0])+(e[1]?'/':'')).join('  ')},
 cd(a){const q=gmPath(a[0]||'~');if(!gmIsDir(q))throw new Error((a[0]||'~')+': No such file or directory');gm.S.cwd=q;gmPs();return ''},
 cat(a,inp){if(!a.length&&inp!==undefined)return inp;if(!a.length)throw new Error('missing file operand');return a.map(gmFile).join('\n')},
 head(a,inp){const[n,f]=gmNopt(a,10);return gmSrc(f,inp).split('\n').slice(0,n).join('\n')},
 tail(a,inp){const[n,f]=gmNopt(a,10);return gmSrc(f,inp).split('\n').slice(-n).join('\n')},
 grep(a,inp){const fl=a.filter(x=>/^-[a-z]+$/.test(x)).join(''),r=a.filter(x=>!/^-[a-z]+$/.test(x));if(r[0]==null)throw new Error('missing pattern');
  let re;try{re=new RegExp(r[0],fl.includes('i')?'i':'')}catch(e){re=new RegExp(r[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),fl.includes('i')?'i':'')}
  const out=gmSrc(r.slice(1),inp).split('\n').filter(x=>re.test(x)!==fl.includes('v'));return fl.includes('c')?String(out.length):out.join('\n')},
 cut(a,inp){let d='\t',f=1;const r=[];for(let i=0;i<a.length;i++){const x=a[i];if(x==='-d')d=a[++i];else if(x.startsWith('-d'))d=x.slice(2);else if(x==='-f')f=+a[++i];else if(x.startsWith('-f'))f=+x.slice(2);else r.push(x)}
  return gmSrc(r,inp).split('\n').map(l=>l.split(d)[f-1]||'').join('\n')},
 sort(a,inp){const n=a.includes('-n')||a.includes('-rn')||a.includes('-nr'),rv=a.some(x=>/^-\w*r\w*$/.test(x)),f=a.filter(x=>x[0]!=='-');
  const o=gmSrc(f,inp).split('\n').sort(n?(x,y)=>parseFloat(x.trim())-parseFloat(y.trim()):(x,y)=>x<y?-1:x>y?1:0);return (rv?o.reverse():o).join('\n')},
 uniq(a,inp){const c=a.includes('-c'),f=a.filter(x=>x[0]!=='-'),o=[];for(const l of gmSrc(f,inp).split('\n')){const t=o[o.length-1];if(t&&t[0]===l)t[1]++;else o.push([l,1])}return o.map(e=>c?String(e[1]).padStart(7)+' '+e[0]:e[0]).join('\n')},
 wc(a,inp){const t=gmSrc(a.filter(x=>x[0]!=='-'),inp),n=t?t.split('\n').length:0;return a.includes('-l')?String(n):n+' '+(t.trim()?t.trim().split(/\s+/).length:0)+' '+t.length},
 base64(a,inp){const dec=a.includes('-d')||a.includes('--decode'),r=a.filter(x=>x[0]!=='-');let s;
  if(r.length){const q=gmPath(r[0]);s=gm.S.f[q]?gm.S.f[q].c:r.join(' ')}else s=inp;if(s==null)throw new Error('missing input');s=s.trim();
  if(dec){try{return atob(s)}catch(e){throw new Error('invalid input')}}return btoa(s)},
 rot13(a,inp){const r=a.filter(x=>x[0]!=='-');let s;if(r.length){const q=gmPath(r[0]);s=gm.S.f[q]?gm.S.f[q].c:r.join(' ')}else s=inp;if(s==null)throw new Error('missing input');return gmRot(s)},
 chmod(a){const m=a[0],t=a[1];if(!m||!t)throw new Error('usage: chmod +x file');const q=gmPath(t),f=gm.S.f[q];if(!f)throw new Error("cannot access '"+t+"': No such file or directory");
  const pl=m.match(/^([ugoa]*)\+x$/);
  if(pl){const w=pl[1]||'a',ix=w.includes('a')?[3,6,9]:[...w].map(x=>({u:3,g:6,o:9})[x]);f.p=f.p.split('').map((c,i)=>ix.includes(i)?'x':c).join('')}
  else if(/^[0-7]{3}$/.test(m))f.p='-'+gmOct(m);else throw new Error("invalid mode: '"+m+"'");return ''},
 next(){if(!gm.done[gm.lv]){gmPrint('Solve this level first (type hint if you are stuck).','e');return ''}if(gm.lv>=CGL.length-1){gmPrint('You finished every level. Type level to replay this one, or press Restart.','o');return ''}gmLoad(gm.lv+1);return ''},
 submit(a){const g=a.join(' ').trim(),L=CGL[gm.lv];if(!g)throw new Error('usage: submit FLAG{...}');
  if(g===L.flag){const first=!gm.done[gm.lv];gmMark();gmPrint('✔ Correct! Level '+(gm.lv+1)+' complete.'+(gm.lv<CGL.length-1?' Type next to continue.':''),'o');if(gmSolved()===CGL.length&&first)gmPrint('🏁 All '+CGL.length+' levels solved. You think like a defender now.','o')}
  else gmPrint('✘ Incorrect flag. Keep looking, or type hint.','e');return ''}
};
function gmExec(c){const q=gmPath(c),f=gm.S.f[q];if(!f)throw new Error('No such file or directory');if(f.p[3]!=='x')throw new Error('Permission denied');
 return f.c.split('\n').filter(l=>l.startsWith('echo ')).map(l=>gmTok(l.slice(5)).join(' ')).join('\n')}
function gmRun(line){
 gmPrint($('#gmPs').textContent+' '+line,'p');
 const segs=line.split('|').map(s=>gmTok(s.trim())).filter(x=>x.length);let inp;
 for(const t of segs){const c=t[0],a=t.slice(1);let f=Object.prototype.hasOwnProperty.call(CM,c)?CM[c]:null;
  if(!f&&(c.startsWith('./')||c.startsWith('/')))f=()=>gmExec(c);
  if(!f){gmPrint('bash: '+c+': command not found','e');return}
  try{inp=f(a,inp)}catch(e){gmPrint(c+': '+e.message,'e');return}}
 if(inp)gmPrint(inp,'c')}
function gmLoad(i){gm.lv=i;const L=CGL[i];gm.S=L.mk();gm.S.cwd=L.cwd;sv('cgl',i);gmBrief();gmChips();gmPrint('— '+L.t[0]+' —','o');gmPrint('Type help for commands, hint if you are stuck.','d');gmPs()}
function gmBrief(){const L=CGL[gm.lv],e=$('#gmBrief');if(e)e.innerHTML='<b>'+esc(P(L.t))+'</b><br>'+esc(P(L.b))}
function gmChips(){const e=$('#gmChips');if(!e)return;e.innerHTML=CGL.map((L,i)=>`<button class="chip${gm.done[i]?' ok':''}" aria-pressed="${i===gm.lv}" data-act="gm:lv:${i}">${i+1}</button>`).join('');const s=$('#gmScore');if(s)s.textContent=T('cgScore')+' '+gmSolved()+'/'+CGL.length}
